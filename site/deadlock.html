<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Deadlock Radar · Umbrella Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--sec:#efefec;--border:#e2e2de;--soft:#ebebe8;--fg:#18181a;--muted:#62626a;--faint:#9a9aa1;--ok:#2f9a5e;--warn:#b07d1c;--bad:#c93c3c;
  --amber:#c98512;--sapph:#2f6fd0;--violet:#7c4dcc;--mapbg:#0d1018;--hp:#2f9a5e}
.dark{--bg:#0c0c0d;--card:#121214;--sec:#19191c;--border:#222225;--soft:#1a1a1d;--fg:#ececee;--muted:#9a9aa1;--faint:#616168;--ok:#57c785;--warn:#d9a84e;--bad:#ef6b6b;
  --amber:#f0a93b;--sapph:#5b9bf5;--violet:#b394f0;--mapbg:#0a0d14;--hp:#4cb879}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{border-bottom:1px solid var(--soft);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);flex:none}
.bar{display:flex;align-items:center;height:56px;gap:16px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
.crumb{color:var(--faint);font-weight:500;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.sp{flex:1}
.chip{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.chip.warn .dot{background:var(--warn)}
.chip.bad .dot{background:var(--bad)}
#clock{font-weight:600;color:var(--fg)}
.ghost{height:32px;width:32px;border-radius:8px;color:var(--muted);display:grid;place-items:center;transition:.15s}
.ghost:hover{color:var(--fg);background:var(--sec)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 20px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card-h{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--soft);flex:none}
.card-h h2{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.card-h h2 i{color:var(--faint);font-size:12px}
.score{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:10px 18px}
.score[hidden]{display:none}
.side{display:flex;align-items:center;gap:14px;min-width:0}
.side.s{flex-direction:row-reverse;text-align:right}
.side .flag{width:6px;align-self:stretch;border-radius:3px;background:var(--tc)}
.side b{font:700 22px/1 'Barlow Condensed',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.side small{display:block;color:var(--faint);font-size:12px;font-weight:500}
.side .g{margin-left:auto;font:700 26px/1 'Barlow Condensed',sans-serif;color:var(--tc)}
.side.s .g{margin-left:0;margin-right:auto}
.mid{text-align:center}
.mid .t{font:700 34px/1 'Barlow Condensed',sans-serif;letter-spacing:.04em}
.mid .st{font-size:12px;color:var(--faint);font-weight:500;margin-top:2px}
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px;background:var(--mapbg)}
canvas{border-radius:10px;display:block;background:var(--mapbg)}
#tip{position:absolute;z-index:6;pointer-events:none;background:rgba(12,12,13,.92);border:1px solid rgba(255,255,255,.1);color:#e4e4e7;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;display:none;white-space:nowrap}
#tip b{color:#fff}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#empty.on{display:flex}
#empty div{background:rgba(12,12,13,.82);border:1px solid rgba(255,255,255,.08);color:#d4d4d8;border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:center;font-weight:500}
.gear{position:absolute;right:20px;top:20px;z-index:3;width:30px;height:30px;border-radius:8px;color:#d4d4d8;display:grid;place-items:center;background:rgba(12,12,13,.72);border:1px solid rgba(255,255,255,.1)}
.gear:hover{color:#fff}
.opts{position:absolute;right:20px;top:56px;z-index:20;width:300px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:8px;display:none}
.opts.on{display:block}
.opts .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.opt{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;border:1px solid var(--border);font-size:12px;font-weight:500;color:var(--muted);text-align:left;min-width:0}
.opt i{width:14px;text-align:center;color:var(--faint);font-size:11px}
.opt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt.on{color:var(--fg);background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.opt.on i{color:var(--ok)}
.legend{display:flex;justify-content:center;gap:6px 16px;padding:7px 12px;border-top:1px solid var(--soft);font-size:11.5px;color:var(--faint);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#teams{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.team-h{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--soft);position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px)}
.team-h .flag{width:8px;height:8px;border-radius:2px;background:var(--tc)}
.team-h h3{font-size:13px;font-weight:600}
.team-h .sum{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--faint)}
.team-h .sum b{color:var(--fg);font-weight:600}
.hero{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--soft)}
.hero:hover{background:var(--sec)}
.hero .ic{position:relative;width:36px;height:36px;flex:none;border-radius:50%;background:#1a1a1d;box-shadow:0 0 0 2px var(--tc)}
.hero .ic img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.hero.dead .ic img{filter:grayscale(1) brightness(.5)}
.hero.fog .ic img{filter:saturate(.4) brightness(.75)}
.hero .ic u{position:absolute;right:-3px;bottom:-3px;min-width:15px;height:15px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 9px/15px system-ui;text-align:center;text-decoration:none;padding:0 3px}
.hero .main{flex:1;min-width:0}
.hero .l1{display:flex;align-items:center;gap:8px}
.hero .nm{font-weight:600;font-size:13px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .st{margin-left:auto;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.hero .st.fog{color:var(--warn)} .hero .st.dead{color:var(--bad)} .hero .st.cc{color:var(--violet)}
.hero .bar{height:9px;border-radius:4px;background:var(--sec);overflow:hidden;margin:4px 0 3px;position:relative}
.hero .bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--hp)}
.hero .l3{display:flex;flex-wrap:wrap;gap:3px;font-size:10.5px}
.hero .l3 span{padding:0 6px;border-radius:5px;background:var(--sec);color:var(--muted);white-space:nowrap}
.hero .l3 span.g{color:var(--warn);font-weight:600}
.sls{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 3px}
.sls.it .sl{width:26px;height:26px}
.sl{position:relative;width:30px;height:30px;border-radius:7px;background:#1a1a1d;overflow:hidden;box-shadow:0 0 0 1px var(--border)}
.sl img{width:100%;height:100%;object-fit:cover;display:block}
.sl.cd img{filter:brightness(.4)}
.sl.lock img{filter:grayscale(1) brightness(.6)}
.sl b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.hero .kda{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.hero .kda b{color:var(--fg)}
.hero .kda b.d{color:var(--bad)}
.hero .nm em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--bg);background:var(--fg);border-radius:4px;padding:0 4px;margin-left:4px;text-transform:uppercase}
.hero .st{margin-left:8px}
.hero .bar b{position:absolute;right:5px;top:-1px;font-size:8.5px;line-height:7px;font-weight:700;color:#fff;text-shadow:0 0 2px #000}
.kit{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--soft)}
.kit div{flex:1;border-radius:8px;background:var(--sec);padding:5px 6px;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kit div b{display:block;font-size:12px}
.kit div.cd b{color:var(--bad)} .kit div.rdy b{color:var(--ok)}
.objs{overflow-y:auto;scrollbar-width:thin;padding:2px 0}
.obj{display:flex;align-items:center;gap:10px;padding:5px 14px;min-height:34px}
.obj + .obj{border-top:1px solid var(--soft)}
.obj > i{width:24px;height:24px;border-radius:6px;background:var(--sec);color:var(--muted);display:grid;place-items:center;font-size:11px;flex:none}
.obj .k{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .v{font-size:12.5px;font-weight:600;white-space:nowrap}
.obj .v.ok{color:var(--ok)} .obj .v.bad{color:var(--bad)} .obj .v.warn{color:var(--warn)} .obj .v.none{color:var(--faint);font-weight:500}
#log{flex:1;min-height:0;overflow:auto;padding:6px 0;scrollbar-width:thin}
#log:empty::after{content:'No events yet';display:block;color:var(--faint);font-size:13px;padding:12px 14px}
.ev{display:grid;grid-template-columns:42px 16px 1fr;gap:8px;align-items:start;padding:4px 14px 4px 11px;border-left:3px solid transparent;font-size:12.5px;line-height:1.4}
.ev:hover{background:var(--sec)}
.ev .t{color:var(--faint);font-size:11.5px}
.ev i{color:var(--faint);font-size:11px;padding-top:3px;text-align:center}
.ev .x{color:var(--muted)} .ev .x b{color:var(--fg);font-weight:600}
.ev.a{border-left-color:var(--amber)} .ev.s{border-left-color:var(--sapph)} .ev.boss{border-left-color:var(--warn)} .ev.rift{border-left-color:var(--violet)}
@media(max-width:1000px){.cols{grid-template-columns:1fr}main{overflow-y:auto}#stage{flex:none;height:min(100vw,640px)}.stack{min-height:auto}#teams,#log{max-height:420px}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><i class="fa-solid fa-crosshairs"></i>Deadlock Radar</div>
  <div class="crumb"><b>Midtown</b></div>
  <div class="sp"></div>
  <div id="clock"></div>
  <div class="chip" id="status"><span class="dot"></span><span id="stext">Connecting</span></div>
  <button class="ghost" id="theme" title="Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
</div></header>
<main>
  <div class="card score" id="score" hidden></div>
  <div class="cols">
    <div class="card">
      <div id="stage">
        <canvas id="map"></canvas>
        <div id="tip"></div>
        <div id="empty"><div><i class="fa-solid fa-hourglass-half"></i><span id="etext">Waiting for a match</span></div></div>
        <button class="gear" id="gear"><i class="fa-solid fa-sliders"></i></button>
        <div class="opts" id="opts"><div class="grid" id="optgrid"></div></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--amber)"></i>Amber</span><span><i style="background:var(--sapph)"></i>Sapphire</span>
        <span><i style="background:#9aa3b2"></i>Neutral</span><span><i style="background:#ffb020"></i>Mid Boss</span>
        <span><i style="background:#b36bff"></i>Powerup</span><span><i style="background:#7ad7ff"></i>Urn</span><span><i style="background:#ff4df0"></i>Rift</span>
      </div>
    </div>
    <div class="stack">
      <div class="card" style="flex:3;min-height:380px"><div class="card-h"><h2><i class="fa-solid fa-users"></i>Heroes</h2></div><div id="teams"></div></div>
      <div class="card" style="flex:none;max-height:190px"><div class="card-h"><h2><i class="fa-solid fa-flag"></i>Objectives</h2></div><div class="objs" id="objs"></div></div>
      <div class="card" style="flex:.4;min-height:90px"><div class="card-h"><h2><i class="fa-solid fa-bolt"></i>Events</h2></div><div id="log"></div></div>
    </div>
  </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyCGf2e4CIJm1or0klbzXXI5wlfvXPqS514",
  authDomain: "umbrella-scripts.firebaseapp.com",
  databaseURL: "https://umbrella-scripts-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "umbrella-scripts",
});
const sid = location.hash.replace(/^#\/?/, '');
const $ = id => document.getElementById(id);
const L = a => Array.isArray(a) ? a : a ? Object.values(a) : [];
const BASE = 'radar/deadlock/';
const ALIAS = { atlas: 'bull', dynamo: 'sumo', forge: 'engineer', ghost: 'spectre', krill: 'digger', orion: 'archer', viper: 'kali', targetdummy: 'generic' };
const heroIcon = n => BASE + 'hero/' + (ALIAS[n] || n) + '.png';
const AMBER = 2, SAPPH = 3;
const TCOL = { 2: '#f0a93b', 3: '#5b9bf5', 0: '#9aa3b2' };
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

const root = document.documentElement;
function setTheme(t) { root.className = t; store.set('dl_theme', t); }
setTheme(store.get('dl_theme') === null ? 'dark' : store.get('dl_theme'));
$('theme').onclick = () => setTheme(root.className === 'dark' ? '' : 'dark');

const LAYERS = [['heroes', 'fa-user', 'Heroes'], ['bars', 'fa-heart-pulse', 'Health bars'], ['view', 'fa-location-arrow', 'View direction'], ['troopers', 'fa-people-group', 'Troopers'],
  ['neutrals', 'fa-paw', 'Neutrals'], ['camps', 'fa-tree', 'Camps'], ['powerups', 'fa-gem', 'Powerups'],
  ['buildings', 'fa-chess-rook', 'Buildings'], ['boss', 'fa-skull', 'Mid Boss'], ['urn', 'fa-jar', 'Urn'], ['rift', 'fa-circle-nodes', 'Rift'], ['labels', 'fa-clock', 'Timers']];
let layers = {};
try { layers = JSON.parse(store.get('dl_layers') || '{}'); } catch (e) {}
const on = k => layers[k] !== false;
function drawOpts() {
  $('optgrid').innerHTML = LAYERS.map(l => '<button class="opt' + (on(l[0]) ? ' on' : '') + '" data-k="' + l[0] + '"><i class="fa-solid ' + l[1] + '"></i><span>' + l[2] + '</span></button>').join('');
  for (const b of $('optgrid').children) b.onclick = () => { layers[b.dataset.k] = !on(b.dataset.k); store.set('dl_layers', JSON.stringify(layers)); drawOpts(); };
}
drawOpts();
$('gear').onclick = () => $('opts').classList.toggle('on');

const img = new Map();
function pic(src) {
  let i = img.get(src);
  if (!i) { i = new Image(); i.src = src; img.set(src, i); }
  return i.complete && i.naturalWidth ? i : null;
}

const canvas = $('map'), ctx = canvas.getContext('2d');
let live = {}, seenAt = 0, W = 1024, hover = null;
const me = () => (live.clock || {}).me;
const gt = () => (live.clock || {}).gt || 0;
const fmt = s => { s = Math.max(0, s | 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const title = s => String(s || '').replace(/_/g, ' ');

function half() { const mp = live.mp; return mp && mp.ay ? 140 / Math.abs(mp.ay) : 10086; }
function pt(x, y) { const h = half(); return [(0.5 + x / (2 * h)) * W, (0.5 - y / (2 * h)) * W]; }

function fitCanvas() {
  const box = $('stage'), side = Math.max(200, Math.min(box.clientWidth - 20, box.clientHeight - 20));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.round(side * dpr);
  canvas.width = canvas.height = W;
  canvas.style.width = canvas.style.height = side + 'px';
}
new ResizeObserver(fitCanvas).observe($('stage'));
fitCanvas();

function dot(p, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 2; ctx.strokeStyle = stroke; ctx.stroke(); }
}
const S = () => W / 1024;
const placed = [];
function label(p, text, dy, color, size, force) {
  const s = S(), px = (size || 12) * s * 1.15;
  ctx.font = '700 ' + px + 'px system-ui,sans-serif'; ctx.textAlign = 'center';
  const w = ctx.measureText(text).width + 4 * s, h = px + 2 * s;
  let y = p[1] + dy * s, ok = false;
  for (const off of [0, 1, -1, 2, -2, 3]) {
    const yy = y + off * (h + 1 * s), r = { x0: p[0] - w / 2, x1: p[0] + w / 2, y0: yy - h * 0.85, y1: yy + h * 0.25 };
    if (!placed.some(q => r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0)) { placed.push(r); y = yy; ok = true; break; }
  }
  if (!ok && !force) return;
  ctx.lineWidth = 3 * s; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(text, p[0], y);
  ctx.fillStyle = color || '#fff'; ctx.fillText(text, p[0], y);
}
let IDX = { ab: {}, it: [] };
fetch(BASE + 'icons/index.json').then(r => r.json()).then(j => { IDX = j; }).catch(() => {});
const ICON = n => BASE + 'icons/map/' + n + '.png';
function abilityIcon(hero, name) {
  const list = IDX.ab[ALIAS[hero] || hero]; if (!list) return null;
  const nm = String(name).replace(/^(citadel_ability_|ability_)/, '');
  const f = list.find(x => x === nm) || list.find(x => x.endsWith('_' + nm)) || list.find(x => nm.endsWith('_' + x.replace(/^[a-z]+_/, '')) && x.replace(/^[a-z]+_/, '').length > 3) || list.find(x => x.includes(nm));
  return f ? BASE + 'icons/ab/' + (ALIAS[hero] || hero) + '/' + f + '.png' : null;
}
function itemIcon(name) {
  const n = String(name).replace(/^upgrade_/, '');
  const f = IDX.it.find(x => x === name) || IDX.it.find(x => x === n);
  return f ? BASE + 'icons/it/' + f + '.png' : null;
}
const hits = [];
function hit(p, r, html) { hits.push({ x: p[0], y: p[1], r: Math.max(r, 9 * S()), html }); }

function glow() {
  for (const o of L(live.o).filter(o => /Tier3/.test(o.c))) {
    const p = pt(o.x, o.y), g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], 190 * S());
    g.addColorStop(0, TCOL[o.t] + '55'); g.addColorStop(1, TCOL[o.t] + '00');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, W);
  }
}

function draw() {
  requestAnimationFrame(draw);
  hits.length = 0; placed.length = 0;
  ctx.clearRect(0, 0, W, W);
  const m = pic(BASE + 'map_color.jpg');
  if (m) ctx.drawImage(m, 0, 0, W, W);
  glow();
  const s = S();

  if (on('urn')) for (const l of L(live.ud)) dot(pt(l[0], l[1]), 9 * s, null, '#7ad7ff', 2 * s);
  const rf = live.rf;
  if (on('rift') && rf) for (const l of L(rf.loc)) {
    const p = pt(l.x, l.y), act = l.id === rf.aid, warn = l.id === rf.wid;
    if (act || warn) { dot(p, 14 * s, null, act ? '#ff4df0' : '#ffb020', 3 * s); hit(p, 14 * s, '<b>Rift</b><br>' + (act ? 'active' : 'warning')); }
  }
  const sprite = (name, p, size, ring) => {
    const i = pic(ICON(name)); if (!i) return false;
    const r = size / 2;
    if (ring) { ctx.save(); ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.clip(); ctx.drawImage(i, p[0] - r, p[1] - r, size, size); ctx.restore(); dot(p, r, null, ring, 2 * s); }
    else ctx.drawImage(i, p[0] - r, p[1] - r, size, size);
    return true;
  };
  if (on('camps')) for (const c of L(live.c)) {
    const p = pt(c.x, c.y), alive = c.s === 2, sin = c.k === 37, r = (sin ? 11 : c.k === 36 ? 10 : c.k === 35 ? 9 : 8) * s;
    if (alive) {
      const nm = sin ? 'sinner' : c.k === 36 ? 'neutral_large' : c.k === 35 ? 'neutral_medium' : 'neutral_small';
      if (!sprite(nm, p, r * 2.2)) dot(p, r * 0.7, '#e0b84a', '#000', 1.5 * s);
      if (on('labels') && c.mh > 0 && c.hp < c.mh) label(p, Math.round(100 * c.hp / c.mh) + '%', -r / s - 4);
      hit(p, r, '<b>' + (sin ? 'Sinner camp' : 'Camp') + '</b> ' + (c.k === 36 ? 'large' : c.k === 35 ? 'medium' : c.k === 34 ? 'small' : '') + '<br>' + c.hp + ' / ' + c.mh + ' HP');
    } else if (c.nx && c.nx > gt()) {
      if (on('labels')) label(p, fmt(c.nx - gt()), 4, sin ? '#ff9a66' : '#e0b84a', 11);
      hit(p, r, '<b>' + (sin ? 'Sinner camp' : 'Camp') + '</b><br>respawn in ' + fmt(c.nx - gt()));
    }
  }
  if (on('neutrals')) for (const x of L(live.sn)) {
    if (x.a === false) continue;
    const p = pt(x.x, x.y), left = x.lp && x.ph != null ? Math.max(0, x.lp - x.ph) : null;
    if (!sprite('sinner', p, 24 * s)) dot(p, 8 * s, '#d96a3a', '#000', 2 * s);
    if (x.jw) dot(p, 14 * s, null, '#ffd54a', 3 * s);
    if (on('labels')) {
      if (x.jw) label(p, 'JACKPOT', -17, '#ffd54a', 11, true);
      if (x.mh > 0 && x.hp < x.mh) label(p, Math.round(100 * x.hp / x.mh) + '%', 22, '#fff', 11);
    }
    hit(p, 12 * s, '<b>Sinner</b><br>' + x.hp + ' / ' + x.mh + (x.jw ? '<br>jackpot window open' : left != null ? '<br>jackpot cycle ' + fmt(left) : ''));
  }
  if (on('troopers')) for (const t of L(live.tr)) {
    if (t[2] === 0 && !on('neutrals')) continue;
    dot(pt(t[0], t[1]), (t[2] === 0 ? 2 : 3) * s, TCOL[t[2]] || '#9aa3b2');
  }
  const BICON = { TrooperBoss: ['guardian', 15], Boss_Tier2: ['walker', 17], Boss_Tier3: ['patron', 25], BarrackBoss: ['turret', 12], BaseDefenseSentry: ['shield', 12] };
  if (on('buildings')) for (const o of L(live.o)) {
    if (o.a === false) continue;
    const p = pt(o.x, o.y), key = Object.keys(BICON).find(k => o.c.includes(k)), col = TCOL[o.t] || '#999';
    const nm = '<b>' + title(o.c.replace(/^C_(NPC_)?/, '')) + '</b><br>' + o.hp + ' / ' + o.mh;
    if (key) {
      const sz = BICON[key][1] * 2 * s;
      if (!sprite(BICON[key][0], p, sz, col)) { ctx.fillStyle = col; ctx.fillRect(p[0] - 6 * s, p[1] - 6 * s, 12 * s, 12 * s); }
      if (o.mh > 0 && o.hp < o.mh) {
        ctx.fillStyle = '#000'; ctx.fillRect(p[0] - sz / 2, p[1] + sz / 2 + 2 * s, sz, 4 * s);
        ctx.fillStyle = col; ctx.fillRect(p[0] - sz / 2, p[1] + sz / 2 + 2 * s, sz * o.hp / o.mh, 4 * s);
      }
      hit(p, sz / 2, nm);
    } else {
      ctx.fillStyle = col; ctx.fillRect(p[0] - 5 * s, p[1] - 5 * s, 10 * s, 10 * s);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5 * s; ctx.strokeRect(p[0] - 5 * s, p[1] - 5 * s, 10 * s, 10 * s);
      hit(p, 6 * s, nm);
    }
  }
  const PU = { 1: '#ff7a45', 2: '#4fd1ff', 3: '#58e08a', 4: '#b36bff' }, PUN = { 1: 'weapon', 2: 'movement', 3: 'survival', 4: 'casting' };
  if (on('powerups')) for (const u of L(live.u)) {
    const p = pt(u.x, u.y), act = u.s === 3;
    dot(p, 8 * s, act ? (PU[u.k] || '#b36bff') : '#3a3f4b', '#000', 2 * s);
    if (!act && u.nx && u.nx > gt() && on('labels')) label(p, fmt(u.nx - gt()), -12, '#b36bff', 11);
    hit(p, 8 * s, '<b>Powerup</b>' + (act ? ' ' + (PUN[u.k] || '') : '') + '<br>' + (act ? 'ready' : u.nx ? 'in ' + fmt(u.nx - gt()) : 'waiting'));
  }
  if (on('boss') && live.b) {
    const b = live.b, p = pt(b.x, b.y), alive = b.s === 2;
    ctx.save(); ctx.globalAlpha = alive ? 1 : 0.4;
    if (!sprite('midboss', p, 30 * s)) dot(p, 13 * s, '#ffb020', '#000', 2.5 * s);
    ctx.restore();
    if (on('labels')) {
      if (alive && typeof b.f === 'number' && b.f < 1) label(p, Math.round(b.f * 100) + '%', -20, '#ffb020', 12);
      else if (!alive && b.nx && b.nx > gt()) label(p, fmt(b.nx - gt()), 26, '#ffb020', 12);
    }
    hit(p, 15 * s, '<b>Mid Boss</b><br>' + ['unknown', 'waiting', 'alive', 'dead'][b.s || 0]);
  }
  if (on('urn') && live.ur && typeof live.ur.x === 'number') {
    const p = pt(live.ur.x, live.ur.y);
    if (!sprite('urn', p, 22 * s)) dot(p, 8 * s, '#7ad7ff', '#000', 2 * s);
    hit(p, 11 * s, '<b>Urn</b><br>' + ['unknown', 'unavailable', 'on ground', 'carried', 'dropped', 'returning'][live.ur.s || 0]);
  }
  if (on('heroes')) for (const h of L(live.pos).sort((a, b) => (a.me ? 1 : 0) - (b.me ? 1 : 0))) {
    if (h.a === false) continue;
    const p = pt(h.x, h.y), col = TCOL[h.t] || '#999', r = 17 * s;
    ctx.save(); ctx.globalAlpha = h.d ? 0.5 : 1;
    if (on('view') && typeof h.yaw === 'number') {
      const a = -h.yaw * Math.PI / 180, d1 = r + 11 * s, d0 = r + 1 * s;
      ctx.beginPath(); ctx.moveTo(p[0] + Math.cos(a) * d1, p[1] + Math.sin(a) * d1);
      ctx.lineTo(p[0] + Math.cos(a + 2.4) * d0, p[1] + Math.sin(a + 2.4) * d0);
      ctx.lineTo(p[0] + Math.cos(a - 2.4) * d0, p[1] + Math.sin(a - 2.4) * d0);
      ctx.fillStyle = col; ctx.fill();
    }
    const i = pic(heroIcon(h.n));
    if (i) {
      ctx.save(); ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.clip();
      ctx.drawImage(i, p[0] - r, p[1] - r, r * 2, r * 2); ctx.restore();
      dot(p, r, null, h.me ? '#fff' : col, 3 * s);
    } else dot(p, r, '#333', col, 3 * s);
    if (on('bars') && h.mh > 0) {
      ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(p[0] - r, p[1] + r + 3 * s, r * 2, 5 * s);
      ctx.fillStyle = col; ctx.fillRect(p[0] - r, p[1] + r + 3 * s, r * 2 * Math.min(1, h.hp / h.mh), 5 * s);
    }
    if (h.cc) label(p, '!', -r / s - 4, '#ffd54a', 15);
    ctx.restore();
    hit(p, r, '<b style="text-transform:capitalize">' + esc(h.n) + '</b><br>' + h.hp + ' / ' + h.mh + ' HP' + (h.g ? '<br>' + h.g + ' gold' : '') + (h.d ? '<br>not visible' : ''));
  }
  const tip = $('tip');
  if (hover) {
    const best = hits.filter(q => Math.hypot(q.x - hover.x, q.y - hover.y) <= q.r + 4 * s).sort((a, b) => Math.hypot(a.x - hover.x, a.y - hover.y) - Math.hypot(b.x - hover.x, b.y - hover.y))[0];
    if (best) { tip.innerHTML = best.html; tip.style.display = 'block'; tip.style.left = Math.min(hover.cx + 14, $('stage').clientWidth - tip.offsetWidth - 6) + 'px'; tip.style.top = (hover.cy + 14) + 'px'; }
    else tip.style.display = 'none';
  } else tip.style.display = 'none';
}
canvas.onmousemove = e => { const r = canvas.getBoundingClientRect(), k = W / r.width, st = $('stage').getBoundingClientRect(); hover = { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k, cx: e.clientX - st.left, cy: e.clientY - st.top }; };
canvas.onmouseleave = () => { hover = null; };

const seenHero = {};
const kfmt = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n);
function heroRow(h) {
  const dead = h.a === false, fog = !dead && h.d, st0 = h.s || {};
  const pct = h.mh ? Math.round(100 * h.hp / h.mh) : 0;
  let st = '', cls = '';
  if (dead) { st = 'dead'; cls = 'dead'; }
  else if (fog) { const t = seenHero[h.i]; st = t != null ? 'fog ' + fmt(gt() - t) : 'fog'; cls = 'fog'; }
  else if (h.cc) { st = 'disabled'; cls = 'cc'; }
  else if (h.zl) st = 'zipline';
  const nw = st0.nw != null ? st0.nw : h.g;
  const chips = [];
  if (nw) chips.push('<span class="g" title="net worth">' + kfmt(nw) + '</span>');
  if (st0.lh != null) chips.push('<span title="last hits / denies">' + st0.lh + ' / ' + (st0.dn || 0) + '</span>');
  if (st0.hd) chips.push('<span title="hero damage">dmg ' + kfmt(st0.hd) + '</span>');
  if (st0.hh) chips.push('<span title="healing">heal ' + kfmt(st0.hh) + '</span>');
  if (st0.ks > 1) chips.push('<span title="kill streak">streak ' + st0.ks + '</span>');
  if (h.ap) chips.push('<span>AP ' + h.ap + '</span>');
  for (const mod of L(h.mods).filter(m => !/tracker|citadel_ability|hero_upgrade|barrier|trooper|generic|stat_/i.test(m)).slice(0, 3)) chips.push('<span title="' + esc(mod) + '">' + esc(String(mod).replace(/^(modifier_|citadel_modifier_|upgrade_)/, '').replace(/_/g, ' ').slice(0, 16)) + '</span>');
  const abil = [], items = [];
  for (const k of L(h.kit)) {
    const nm = String(k.n);
    const ii = /^upgrade_/.test(nm) ? itemIcon(nm) : null, ai = ii ? null : abilityIcon(h.n, nm);
    const src = ii || ai; if (!src) continue;
    const box = '<div class="sl' + (k.cd > 0 ? ' cd' : '') + (ai && !k.l ? ' lock' : '') + '" title="' + esc(title(nm)) + (k.l ? ' lv' + k.l : '') + '"><img src="' + src + '" alt="" onerror="this.parentNode.remove()">' + (k.cd > 0 ? '<b>' + (k.cd >= 10 ? Math.round(k.cd) : k.cd.toFixed(1)) + '</b>' : '') + '</div>';
    (ii ? items : abil).push(box);
  }
  const kda = st0.k != null ? '<span class="kda"><b>' + st0.k + '</b> / <b class="d">' + (st0.d || 0) + '</b> / <b>' + (st0.a || 0) + '</b></span>' : '';
  return '<div class="hero' + (dead ? ' dead' : '') + (fog ? ' fog' : '') + '" style="--tc:' + (TCOL[h.t] || '#999') + '"><div class="ic"><img src="' + heroIcon(h.n) + '" alt="" onerror="this.style.visibility=\'hidden\'">' + (st0.lv ? '<u>' + st0.lv + '</u>' : h.me ? '<u>YOU</u>' : '') + '</div>' +
    '<div class="main"><div class="l1"><span class="nm">' + esc(title(h.n)) + (h.me ? ' <em>you</em>' : '') + '</span>' + kda + '<span class="st ' + cls + '">' + st + '</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i><b>' + h.hp + '</b></div>' +
    (abil.length ? '<div class="sls">' + abil.join('') + '</div>' : '') + (items.length ? '<div class="sls it">' + items.join('') + '</div>' : '') +
    '<div class="l3">' + (chips.join('') || '<span>' + h.hp + ' / ' + h.mh + '</span>') + '</div></div></div>';
}
const tn = t => t === AMBER ? 'Amber' : t === SAPPH ? 'Sapphire' : 'Neutral';
function teamBlock(team, rows) {
  const gold = rows.reduce((a, h) => a + (h.g || 0), 0), alive = rows.filter(h => h.a !== false).length;
  return '<div class="team-h" style="--tc:' + TCOL[team] + '"><span class="flag"></span><h3>' + tn(team) + (team === me() ? ' · your team' : '') + '</h3><div class="sum"><span><b>' + alive + '</b>/' + rows.length + ' alive</span><span><b>' + (gold / 1000).toFixed(1) + 'k</b> gold</span></div></div>' + rows.map(heroRow).join('');
}

function objRow(icon, k, v, cls) { return '<div class="obj"><i class="fa-solid ' + icon + '"></i><span class="k">' + k + '</span><span class="v ' + (cls || '') + '">' + v + '</span></div>'; }
const RIFT = ['unknown', 'waiting', 'early warning', 'warning', 'spawn window', 'active', 'scoring', 'cooldown'];
const URN = ['unknown', 'not available', 'on ground', 'carried', 'dropped', 'returning'];
function objectives() {
  const rows = [], t = gt(), b = live.b, gr = live.gr || {};
  if (b) rows.push(objRow('fa-skull', 'Mid Boss', b.s === 2 ? (typeof b.f === 'number' ? Math.round(b.f * 100) + '% HP' : 'alive') : b.nx && b.nx > t ? fmt(b.nx - t) : ['unknown', 'waiting', 'alive', 'dead'][b.s || 0], b.s === 2 ? 'warn' : 'none'));
  if (gr.mk) rows.push(objRow('fa-trophy', 'Mid Boss kills', gr.mk));
  if (live.ur) rows.push(objRow('fa-jar', 'Urn', URN[live.ur.s || 0], live.ur.s === 3 ? 'warn' : 'none'));
  const rfp = live.rf;
  if (rfp) rows.push(objRow('fa-circle-nodes', 'Rift', RIFT[rfp.ph || 0] + (rfp.nx && rfp.nx > t && (rfp.ph || 0) < 4 ? ' · ' + fmt(rfp.nx - t) : ''), rfp.ph >= 4 ? 'warn' : 'none'));
  const u = L(live.u);
  if (u.length) { const act = u.filter(x => x.s === 3).length, next = u.filter(x => x.nx && x.nx > t).map(x => x.nx).sort((a, c) => a - c)[0]; rows.push(objRow('fa-gem', 'Powerups', act + ' / ' + u.length + (next ? ' · ' + fmt(next - t) : ''), act ? 'ok' : 'none')); }
  const c = L(live.c);
  if (c.length) { const alive = c.filter(x => x.s === 2).length, next = c.filter(x => x.s !== 2 && x.nx > t).map(x => x.nx).sort((a, d) => a - d)[0]; rows.push(objRow('fa-tree', 'Camps', alive + ' alive / ' + c.length + (next ? ' · next ' + fmt(next - t) : ''))); }
  for (const team of [AMBER, SAPPH]) {
    const o = L(live.o).filter(x => x.t === team && x.a !== false), n = re => o.filter(x => re.test(x.c)).length;
    rows.push(objRow('fa-chess-rook', tn(team) + ' buildings', 'G ' + n(/Tier2/) + ' · B ' + n(/Barrack/) + ' · S ' + n(/Sentry/) + ' · P ' + n(/Tier3/)));
  }
  $('objs').innerHTML = rows.join('');
}

const feed = [];
let prev = null;
function ev(cls, icon, html) { feed.unshift({ t: gt(), cls, icon, html }); if (feed.length > 120) feed.pop(); }
function diff(a, b) {
  if (!a || !a.clock || !b.clock || b.clock.mid !== a.clock.mid) return;
  const old = {}; for (const h of L(a.pos)) old[h.i] = h;
  for (const h of L(b.pos)) {
    const o = old[h.i]; if (!o) continue;
    const cls = h.t === AMBER ? 'a' : 's', nm = '<b>' + esc(title(h.n)) + '</b>';
    if (o.a !== false && h.a === false) ev(cls, 'fa-skull-crossbones', nm + ' died');
    else if (o.a === false && h.a !== false) ev(cls, 'fa-rotate', nm + ' respawned');
    if (h.t !== me()) {
      if (!o.d && h.d && h.a !== false) ev(cls, 'fa-eye-slash', nm + ' went into the fog');
      if (o.d && !h.d && h.a !== false) ev(cls, 'fa-eye', nm + ' spotted');
      if (!o.zl && h.zl) ev(cls, 'fa-grip-lines', nm + ' on a zipline');
    }
  }
  if (a.b && b.b && a.b.s !== b.b.s) ev('boss', 'fa-skull', 'Mid Boss ' + ['unknown', 'waiting', 'spawned', 'killed'][b.b.s || 0]);
  if (a.ur && b.ur && a.ur.s !== b.ur.s) ev('boss', 'fa-jar', 'Urn ' + ['unknown', 'unavailable', 'on the ground', 'picked up', 'dropped', 'returning'][b.ur.s || 0]);
  if (a.rf && b.rf && a.rf.ph !== b.rf.ph) ev('rift', 'fa-circle-nodes', 'Rift: ' + RIFT[b.rf.ph || 0]);
  const ou = L(a.u); L(b.u).forEach((x, i) => { if (!ou[i]) return; if (ou[i].s !== 3 && x.s === 3) ev('rift', 'fa-gem', 'Powerup spawned'); if (ou[i].s === 3 && x.s !== 3) ev('rift', 'fa-gem', 'Powerup taken'); });
  const oc = L(a.c); let cleared = 0; L(b.c).forEach((x, i) => { if (oc[i] && oc[i].s !== 3 && x.s === 3) cleared++; });
  if (cleared) ev('boss', 'fa-tree', cleared + ' camp' + (cleared > 1 ? 's' : '') + ' cleared');
  const ob = L(a.o);
  for (const x of L(b.o)) {
    const o = ob.find(y => y.x === x.x && y.y === x.y && y.c === x.c);
    if (o && o.a !== false && x.a === false) ev(x.t === AMBER ? 'a' : 's', 'fa-chess-rook', tn(x.t) + ' ' + title(x.c.replace(/^C_(NPC_)?/, '')) + ' destroyed');
  }
}

function side() {
  const clock = live.clock || {}, fresh = performance.now() - seenAt < 6000, inMatch = seenAt && clock.gt != null && L(live.pos).length > 0;
  $('status').className = 'chip ' + (!sid ? 'bad' : !seenAt ? '' : fresh ? 'ok' : 'warn');
  $('stext').textContent = !sid ? 'Invalid link' : !seenAt ? 'Connecting' : fresh ? 'Live' : 'No fresh data';
  $('clock').textContent = inMatch ? fmt(clock.gt) : '';
  $('empty').classList.toggle('on', !inMatch || !fresh);
  $('etext').textContent = !sid ? 'Invalid link' : !seenAt ? 'Connecting' : !fresh ? 'No fresh data' : 'Waiting for a match';
  $('score').hidden = !inMatch;
  if (!inMatch) return;
  const gr = live.gr || {}, rows = L(live.pos);
  const sum = t => rows.filter(h => h.t === t).reduce((a, h) => a + (h.g || 0), 0);
  const ag = gr.ag != null ? gr.ag : sum(AMBER), sg = gr.sg != null ? gr.sg : sum(SAPPH);
  const k = n => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : n;
  const sd = (team, g, cls) => '<div class="side ' + cls + '" style="--tc:' + TCOL[team] + '"><span class="flag"></span><div><b>' + tn(team) + '</b><small>' + (team === me() ? 'your team' : 'enemy') + (gr.ar != null ? ' · rejuv ' + (team === AMBER ? gr.ar : gr.sr) : '') + '</small></div><span class="g">' + k(g || 0) + '</span></div>';
  $('score').innerHTML = sd(AMBER, ag, '') + '<div class="mid"><div class="t">' + fmt(clock.gt) + '</div><div class="st">' + (gr.p ? 'paused' : (gr.w === AMBER || gr.w === SAPPH) ? tn(gr.w) + ' wins' : 'in progress') + (gr.sp ? ' · ' + gr.sp + ' watching' : '') + '</div></div>' + sd(SAPPH, sg, 's');
  const mine = me() === SAPPH ? SAPPH : AMBER;
  $('teams').innerHTML = [mine, mine === AMBER ? SAPPH : AMBER].map(t => teamBlock(t, rows.filter(h => h.t === t).sort((a, b) => (b.me ? 1 : 0) - (a.me ? 1 : 0) || a.i - b.i))).join('');
  objectives();
  $('log').innerHTML = feed.map(e => '<div class="ev ' + e.cls + '"><span class="t">' + fmt(e.t) + '</span><i class="fa-solid ' + e.icon + '"></i><span class="x">' + e.html + '</span></div>').join('');
}

if (sid) {
  onValue(ref(getDatabase(app), 'sessions/' + sid + '/live'), snap => {
    const next = snap.val() || {};
    for (const h of L(next.pos)) { if (h.d && h.a !== false) { if (seenHero[h.i] == null) seenHero[h.i] = (next.clock || {}).gt; } else delete seenHero[h.i]; }
    try { diff(prev, next); } catch (e) {}
    prev = next; live = next; seenAt = performance.now();
  });
}
setInterval(side, 500);
side();
draw();
</script>
