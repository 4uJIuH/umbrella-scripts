<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cloud Radar · Umbrella Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--sec:#efefec;--border:#e2e2de;--soft:#ebebe8;--fg:#18181a;--muted:#62626a;--faint:#9a9aa1;--ok:#2f9a5e;--warn:#b07d1c;--bad:#c93c3c;--accent:#18181a;--accent-fg:#fff;
  --rad:#2f9a5e;--dire:#c93c3c;--gold:#b07d1c;--blue:#2f6fd0;--violet:#7c4dcc;--mapbg:#16181b;--hp:#2f9a5e;--mp:#2f6fd0}
.dark{--bg:#0c0c0d;--card:#121214;--sec:#19191c;--border:#222225;--soft:#1a1a1d;--fg:#ececee;--muted:#9a9aa1;--faint:#616168;--ok:#57c785;--warn:#d9a84e;--bad:#ef6b6b;--accent:#ececee;--accent-fg:#0c0c0d;
  --rad:#57c785;--dire:#ef6b6b;--gold:#d9a84e;--blue:#6aa3f0;--violet:#b394f0;--mapbg:#0f1012;--hp:#4cb879;--mp:#4f8fe8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{border-bottom:1px solid var(--soft);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5;flex:none}
.bar{display:flex;align-items:center;height:56px;gap:16px;padding:0 20px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
.crumb{color:var(--faint);display:flex;align-items:center;gap:10px;font-weight:500;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.sp{flex:1}
.chip{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.chip.warn .dot{background:var(--warn)}
.chip.bad .dot{background:var(--bad)}
#clock{color:var(--fg);font-weight:600}
#clock:empty{display:none}
.ghost{height:32px;padding:0 10px;border-radius:8px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:.15s;white-space:nowrap}
.ghost:hover,.ghost.on{color:var(--fg);background:var(--sec)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 8px;border-radius:6px;color:var(--faint);font-size:12px;font-weight:600;transition:color .2s,background .2s}
.seg button.on{color:var(--fg);background:var(--sec)}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 20px 16px}
.cols{flex:1;min-height:0;display:flex;gap:0}
.zone{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.zone.top{flex:none}
.zone.col{flex:none}
.zone.center{flex:1}
.zone.empty{display:none}
.gut{flex:none;width:12px;cursor:col-resize;position:relative}
.gut::after{content:'';position:absolute;left:5px;top:40%;bottom:40%;width:2px;border-radius:1px;background:var(--border);opacity:0;transition:opacity .15s}
.gut:hover::after,.gut.drag::after{opacity:1}
.gut.off{cursor:default;pointer-events:none}
.hgut{flex:none;height:12px;margin:-6px 0;cursor:row-resize;position:relative;z-index:4}
.hgut::after{content:'';position:absolute;top:5px;left:40%;right:40%;height:2px;border-radius:1px;background:var(--border);opacity:0;transition:opacity .15s}
.hgut:hover::after,.hgut.drag::after{opacity:1}
.zone.sized > .card{min-height:60px!important}
.zone > .card{flex:none}
.zone > #mapCard,.zone > #console,.zone > #teamsCard{flex:1 1 0;min-height:220px}
.zone.top > #mapCard{flex:none;height:70vh}
.zone.top > #console,.zone.top > #teamsCard{flex:none;height:320px}
#scoreCard{overflow:visible}
.card:not(#mapCard){zoom:var(--z,1)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--soft);flex:none}
.card-h h2{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.card-h h2 i{color:var(--faint);font-size:12px}
.card-h .sp{flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;color:var(--faint);display:grid;place-items:center;transition:.15s}
.icon-btn:hover{color:var(--fg);background:var(--sec)}
#teamsCard{position:relative;overflow:visible}
#teams{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;border-radius:0 0 12px 12px}
#teamsCard .opts{top:48px;right:10px;width:220px}
.tgroup + .tgroup{border-top:1px solid var(--border)}
.objs{display:flex;flex-direction:column;padding:2px 0;overflow-y:auto;scrollbar-width:thin}
.obj{display:flex;align-items:center;gap:10px;min-width:0;padding:4px 14px;min-height:33px}
.obj + .obj{border-top:1px solid var(--soft)}
.obj > img,.obj > i{width:24px;height:24px;flex:none;object-fit:contain;border-radius:6px;display:grid;place-items:center;font-size:11px}
.obj > img{background:#1a1a1d;padding:3px}
.obj > i{background:var(--sec);color:var(--muted)}
.obj .k{flex:1;min-width:0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .v{font-size:12.5px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:4px}
.obj .v.ok{color:var(--ok)} .obj .v.bad{color:var(--bad)} .obj .v.warn{color:var(--warn)} .obj .v.none{color:var(--faint);font-weight:500}
.obj .v em{font-style:normal;min-width:50px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:1px 7px;border-radius:6px;background:var(--sec);font-size:12px;color:var(--fg)}
.obj .v em::before{content:'';width:6px;height:6px;border-radius:2px;background:var(--tc);flex:none}
.obj .v em.rdy{color:var(--ok)}
.obj .v .it{display:inline-flex;align-items:center;gap:3px;padding:1px 6px 1px 2px;border-radius:6px;background:var(--sec);font-size:12px}
.obj .v .it img{width:22px;height:16px;border-radius:3px;object-fit:cover}
#console{min-height:200px}
#console.pop{height:100vh;border-radius:0;border:0}
#log{flex:1;overflow:auto;padding:6px 0;scrollbar-width:thin}
#log:empty::after{content:attr(data-empty);display:block;color:var(--faint);font-size:13px;padding:12px 14px}
.ev{display:grid;grid-template-columns:40px 20px 1fr;gap:8px;align-items:start;padding:5px 14px 5px 11px;border-left:3px solid transparent;font-size:13px;line-height:1.4}
.ev:hover{background:var(--sec)}
.ev .t{color:var(--faint);font-size:11.5px;padding-top:1px}
.ev img{width:20px;height:20px;border-radius:5px;object-fit:contain;background:#1a1a1d;padding:1px}
.ev .x{color:var(--muted)}
.ev .x b{color:var(--fg);font-weight:600}
.ev.a{border-left-color:var(--rad)} .ev.e{border-left-color:var(--dire)} .ev.boss{border-left-color:var(--gold)} .ev.rune{border-left-color:var(--violet)} .ev.scan{border-left-color:var(--blue)} .ev.smoke{border-left-color:var(--faint)}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:22px;padding:10px 16px 12px;max-width:1240px;width:100%;margin:0 auto}
.sb-team{display:flex;flex-direction:column;gap:7px;min-width:0}
.sb-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:500;padding:0 2px}
.sb-team.d .sb-head{flex-direction:row-reverse}
.sb-head .flag{width:8px;height:8px;border-radius:2px}
.sb-head b{font-size:13px;color:var(--fg);font-weight:600}
.sb-head .gold{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--fg)}
.sb-team.d .sb-head .gold{margin-left:0;margin-right:auto}
.sb-head .gold img{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sb-team.d .tiles{direction:rtl}
.sb-team.d .tile{direction:ltr}
.tile{min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-radius:8px;transition:transform .15s}
.tile:hover{transform:translateY(-1px)}
.tile.empty{visibility:hidden}
.pt{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#1a1a1d;box-shadow:inset 0 2px 0 var(--tc)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt::before{content:'';position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.78));z-index:1}
.pt .lv,.pt .k{position:absolute;bottom:2px;z-index:2;font-size:10.5px;font-weight:700;color:#fff;line-height:1.2}
.pt .lv{left:4px}
.pt .k{right:4px;color:#e4e4e7}
.pt .ul{position:absolute;top:4px;right:4px;z-index:2;min-width:9px;height:9px;border-radius:5px;background:#f5c542;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 8px rgba(245,197,66,.8)}
.pt .ul.cd{min-width:18px;height:14px;top:3px;right:3px;padding:0 4px;background:rgba(0,0,0,.72);box-shadow:none;color:#d4d4d8;font-size:9px;font-weight:700;line-height:14px;text-align:center}
.pt .dt{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:16px}
.tile.dead .pt img{filter:grayscale(1) brightness(.55)} .tile.dead .dt{display:grid}
.tile.fog .pt img{filter:saturate(.35) brightness(.7)}
.tile.fog .pt::after{content:'';position:absolute;inset:0;z-index:2;border:1.5px dashed #e0b44a;border-radius:6px}
.hb,.mb{position:relative;border-radius:3px;background:var(--sec);overflow:hidden}
.hb{height:12px} .mb{height:8px}
.hb i,.mb i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.hb i{background:var(--hp)} .mb i{background:var(--mp)}
.hb b,.mb b{position:absolute;inset:0;font-weight:700;text-align:center;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.8)}
.hb b{font-size:9.5px;line-height:12px} .mb b{font-size:7.5px;line-height:8px}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:18px;min-width:140px}
.score{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700;line-height:1}
.score .r{color:var(--rad)} .score .d{color:var(--dire)}
.score i{font-style:normal;color:var(--faint);font-size:20px;font-weight:500}
.daybox{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;background:var(--sec);font-size:13px;font-weight:700}
.daybox i.day{color:#f5c542} .daybox i.night{color:#8fa8ff}
.daybox span{font-size:11px;color:var(--faint);font-weight:500;display:inline-flex;align-items:center;gap:4px;padding-left:7px;border-left:1px solid var(--border)}
.daybox span i{font-size:9px}
.gear{position:absolute;right:20px;top:20px;z-index:3;width:30px;height:30px;border-radius:8px;color:#d4d4d8;display:grid;place-items:center;transition:.15s;background:rgba(12,12,13,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px)}
.gear:hover,.gear.on{color:#fff;background:rgba(12,12,13,.9)}
.opts{position:absolute;right:20px;top:54px;z-index:20;width:260px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:8px;display:none}
.opts.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.opts h3{font-size:11.5px;font-weight:600;color:var(--faint);padding:6px 8px 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);text-align:left}
.opt:hover{background:var(--sec);color:var(--fg)}
.opt i{width:16px;text-align:center;color:var(--faint);font-size:12px}
.opt span{flex:1}
.sw{width:30px;height:18px;border-radius:9px;background:var(--border);position:relative;transition:.15s;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.opt.on .sw,.sw.on{background:var(--ok)} .opt.on .sw::after,.sw.on::after{left:14px}
.opt.on{color:var(--fg)}
.opts .sep{height:1px;background:var(--soft);margin:6px 4px}
#opts{width:296px;max-height:calc(100% - 70px);overflow-y:auto;scrollbar-width:thin}
#opts .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 2px}
#opts .grid .opt{gap:7px;padding:6px 8px;font-size:12px;border:1px solid var(--border);min-width:0}
#opts .grid .opt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#opts .grid .opt .sw{display:none}
#opts .grid .opt.on{background:color-mix(in srgb,var(--ok) 13%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
#opts .grid .opt.on i{color:var(--ok)}
.hero.hc{display:flex;align-items:center;gap:8px;padding:3px 12px;min-height:30px}
.hc-ic{position:relative;width:24px;height:24px;flex:none;border-radius:6px;background:#1a1a1d}
.hc-ic img{width:100%;height:100%;object-fit:contain;padding:1px;display:block;border-radius:6px}
.hc-ic b{position:absolute;right:-4px;bottom:-4px;min-width:15px;height:13px;padding:0 3px;border-radius:4px;background:var(--fg);color:var(--bg);font-size:9px;font-weight:700;line-height:13px;text-align:center}
.hc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hc-row{display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.hc-row .slot{width:20px;height:20px;border-radius:4px}
.hc-row .slot.it{width:27px;height:20px}
.hc-row .slot.nt{width:19px;height:19px;margin-left:2px}
.hc-row .slot .cd{font-size:9px}
.hc-row .slot .ch{font-size:8px}
.hc-row .gap{width:6px;flex:none}
.hc-bars{display:grid;gap:1px}
.hc-bars i{display:block;height:2px;border-radius:1px;background:var(--sec);overflow:hidden;position:relative}
.hc-bars i b{position:absolute;inset:0 auto 0 0;border-radius:1px}
.hc-bars .h b{background:var(--hp)} .hc-bars .m b{background:var(--mp)}
.hero.hc .st{flex:none;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.hero.hc .st.fog{color:var(--warn)} .hero.hc .st.dead{color:var(--bad)} .hero.hc .st.tp{color:var(--blue)}
#teams.cview .team-h{padding:5px 12px}
#teams.cview .team-h + .hero{border-top:0}
.mapbtns{display:flex;gap:4px;padding:2px 4px}
.mapbtns button{flex:1;height:30px;border-radius:8px;background:var(--sec);color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mapbtns button:hover{color:var(--fg)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px;background:var(--mapbg)}
#map{border-radius:10px;display:block}
#marks{position:absolute;pointer-events:none;overflow:hidden;border-radius:10px}
#marks img{position:absolute;border-radius:50%;box-shadow:0 0 0 2px var(--c),0 2px 8px rgba(0,0,0,.7);transform:translate(-50%,-50%)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#empty.on{display:flex}
#empty div{background:rgba(12,12,13,.82);border:1px solid rgba(255,255,255,.08);color:#d4d4d8;border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:center;font-weight:500;backdrop-filter:blur(6px)}
#empty i{color:#9a9aa1}
.legend{display:flex;justify-content:center;gap:6px 16px;padding:7px 12px;border-top:1px solid var(--soft);font-size:11.5px;color:var(--faint);flex:none;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.team-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--soft);position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px)}
#teams:empty::after{content:attr(data-empty);display:block;color:var(--faint);font-size:13px;padding:14px}
.team-h .flag{width:8px;height:8px;border-radius:2px}
.team-h h2{font-size:13px;font-weight:600}
.team-h .role{font-size:12px;color:var(--faint);font-weight:500}
.team-h .sum{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--faint)}
.team-h .sum b{color:var(--fg);font-weight:600}
.hero{padding:12px 14px;border-top:1px solid var(--soft);transition:background .4s}
.hero.flash{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.hero .who{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.hero .pn{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attrs{display:grid;grid-template-columns:repeat(3,1fr) repeat(4,1fr);gap:1px;margin-top:6px;background:var(--soft);border-radius:8px;overflow:hidden;font-size:11.5px}
.attrs div{background:var(--card);padding:3px 0;text-align:center;font-weight:600;white-space:nowrap}
.attrs div i{font-size:9.5px;margin-right:3px;color:var(--faint)}
.attrs .pri{background:var(--sec)}
.attrs .s i{color:#e0574f} .attrs .g i{color:#4cb879} .attrs .n i{color:#4f8fe8}
.extra{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--faint)}
.extra b{color:var(--muted);font-weight:600}
.team-h + .hero{border-top:0}
.hero .top{display:flex;align-items:center;gap:10px}
.portrait{position:relative;width:32px;height:32px;flex:none;border-radius:8px;background:#1a1a1d}
.portrait img{width:100%;height:100%;border-radius:8px;object-fit:contain;display:block;padding:2px}
.portrait .lv{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:16px;padding:0 4px;border-radius:5px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center}
.hero .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--sec);color:var(--muted);white-space:nowrap}
.state.fog{color:var(--warn)} .state.dead{color:var(--bad)} .state.tp{color:var(--blue)} .state.vis{color:var(--ok)}
.bars{display:grid;gap:3px;margin-top:9px}
.meter{position:relative;height:12px;border-radius:4px;background:var(--sec);overflow:hidden}
.meter.thin{height:6px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter.hp i{background:var(--hp)} .meter.mp i{background:var(--mp)}
.meter b{position:absolute;inset:0;font-size:9px;font-weight:600;line-height:12px;text-align:center;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.kpis{display:grid;gap:1px;margin-top:9px;background:var(--soft);border-radius:8px;overflow:hidden}
.kpis div{background:var(--sec);padding:4px 0;text-align:center}
.kpis span{display:block;font-size:10px;color:var(--faint);line-height:1.3}
.kpis b{font-size:12px;font-weight:600}
.slots{display:flex;gap:3px;margin-top:8px;align-items:center}
.slot{position:relative;width:36px;height:26px;border-radius:5px;background:var(--sec);overflow:hidden;flex:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.sm{width:27px;height:20px;opacity:.7}

function toScreen(x, y) {

}

}
function unit() {

function drawMap() {
  view.half = dotaImg ? MAP_HALF : 8000;
  ctx.clearRect(0, 0, size, size);
  if (!bgCache) {
    const dpr = window.devicePixelRatio || 1;
    bgCache = document.createElement('canvas');
    bgCache.width = Math.round(size * dpr);
    bgCache.height = Math.round(size * dpr);
    const g = bgCache.getContext('2d');
    g.scale(dpr, dpr);
    g.beginPath();
    g.roundRect(0, 0, size, size, 10);
    g.clip();
    g.fillStyle = '#121a14';
    g.fillRect(0, 0, size, size);
    if (dotaImg) {
      const full = size * MAP_IMG_HALF / MAP_HALF;
      g.drawImage(dotaImg, (size - full) / 2, (size - full) / 2, full, full);
    }
    const v = g.createRadialGradient(size / 2, size / 2, size * 0.35, size / 2, size / 2, size * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,.35)');
    g.fillStyle = v;
    g.fillRect(0, 0, size, size);
    g.fillStyle = 'rgba(8,10,14,.16)';
    g.fillRect(0, 0, size, size);
  }
  ctx.drawImage(bgCache, 0, 0, size, size);

function teamColor(team, alpha) {
  const c = team === 2 ? RAD : (team === 3 ? DIRE : NEUTRAL);
  return 'rgba(' + c.join(',') + ',' + (alpha == null ? 1 : alpha) + ')';
}
function list(value) {
  return Array.isArray(value) ? value.filter(Boolean) : (value && typeof value === 'object' ? Object.values(value) : []);
}
function gameTime() {
  const c = live.clock || {};

}
function remaining(readyAt) {
  return typeof readyAt === 'number' ? Math.max(0, readyAt - gameTime()) : 0;
}
function secs(v) {

}
function clockText(t) {

function circle(x, y, r) {

}
function drawIcon(path, x, y, s, round) {
  const im = icon(path);

function label(text, x, y, color, px) {

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const w = ctx.measureText(text).width + 8;

  ctx.beginPath();
  ctx.roundRect(x - w / 2, y - h / 2, w, h, 4);
  ctx.fill();
  ctx.fillStyle = color || '#ececee';
  ctx.fillText(text, x, y + 0.5);
}

function drawVision() {
  if (!layers.wards) return;
  for (const w of list(live.wards)) {
    if (typeof w.r !== 'number' || w.r <= 0) continue;
    const [x, y] = toScreen(w.x, w.y);
    const sentry = w.kind === 'sentry';
    circle(x, y, world(w.r));
    ctx.fillStyle = sentry ? 'rgba(106,163,240,.07)' : teamColor(w.team, 0.07);
    ctx.fill();
    ctx.setLineDash(w.f ? [4, 4] : []);
    ctx.strokeStyle = sentry ? 'rgba(106,163,240,.45)' : teamColor(w.team, 0.4);
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawCamps() {
  if (!layers.jungle) return;
  const u = unit();
  for (const c of list(live.camps)) {
    const [x, y] = toScreen(c.x, c.y);
    ctx.globalAlpha = c.s === 1 ? 0.95 : (c.s === 0 ? 0.3 : 0.55);
    if (!drawIcon(CAMP_ICON, x, y, 12 * u)) { ctx.fillStyle = '#d9a84e'; ctx.fillRect(x - 3 * u, y - 3 * u, 6 * u, 6 * u); }
    ctx.globalAlpha = 1;
    if (c.st) label('×' + c.st, x + 11 * u, y - 7 * u, '#f3d48c', 9);
  }
}

function drawUnits() {
  const u = unit();
  for (const row of list(live.units)) {
    if (typeof row.x !== 'number') continue;
    const [x, y] = toScreen(row.x, row.y);
    const kind = row.kind;
    if (kind === 'building') {
      if (!layers.buildings) continue;
      ctx.globalAlpha = row.f ? 0.55 : 1;
      circle(x, y, 7 * u);
      ctx.fillStyle = teamColor(row.team, 0.9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
      drawIcon(TOWER_ICON, x, y, 11 * u);
      if (typeof row.hp === 'number' && row.hp < 100) {
        ctx.beginPath();
        ctx.arc(x, y, 9.5 * u, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * row.hp / 100);
        ctx.strokeStyle = row.hp > 50 ? '#bbf7d0' : (row.hp > 25 ? '#fde68a' : '#fecaca');
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else if (kind === 'wave') {
      if (!layers.waves) continue;
      const dx = (row.dx || 0) / 100, dy = (row.dy || 0) / 100;
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = teamColor(row.team);
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 4; i++) {
        const along = (i - 1.5) * world(110), side = (i % 2 ? 1 : -1) * world(60);
        circle(x + dx * along - dy * side, y - dy * along - dx * side, 3.2 * u);
        ctx.stroke();
      }
    } else if (kind === 'creep') {
      if (!layers.creeps) continue;
      const r = (row.s ? 3.6 : 2.6) * u;
      if (row.f === 2) {
        ctx.globalAlpha = 0.85;
        circle(x, y, r);
        ctx.strokeStyle = teamColor(row.team);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else {
        ctx.globalAlpha = 1;
        if (row.s) { ctx.beginPath(); ctx.rect(x - r, y - r, r * 2, r * 2); } else circle(x, y, r);
        ctx.fillStyle = teamColor(row.team);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.6)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else if (kind === 'neutral') {
      if (!layers.jungle) continue;
      ctx.globalAlpha = row.f ? 0.35 : 0.95;
      circle(x, y, 2.3 * u);
      ctx.fillStyle = '#d9a84e';
      ctx.fill();
    } else if (kind === 'courier') {
      if (!layers.couriers) continue;
      ctx.globalAlpha = row.f ? 0.45 : 1;
      ctx.beginPath();
      ctx.moveTo(x, y - 5 * u); ctx.lineTo(x + 4 * u, y); ctx.lineTo(x, y + 5 * u); ctx.lineTo(x - 4 * u, y); ctx.closePath();
      ctx.fillStyle = teamColor(row.team);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (kind === 'roshan') {
      ctx.globalAlpha = 1;
      drawIcon('roshan.png', x, y, 22 * u);
    } else if (kind === 'tormentor') {
      ctx.globalAlpha = row.f ? 0.6 : 1;
      drawIcon(TORM_ICON(row.x + row.y < 0 ? 'radiant' : 'dire'), x, y, 20 * u);
    } else if (kind === 'wisdom') {
      ctx.globalAlpha = row.f ? 0.6 : 1;
      drawIcon('Wisdom.png', x, y, 18 * u);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWards() {

function drawRunes() {

let marks = [];
function drawEvents() {
  if (!layers.events) return;
  const u = unit();
  const t = gameTime();
  const pulse = (performance.now() % 1200) / 1200;
  for (const e of list(live.events)) {
    const [x, y] = toScreen(e.x, e.y);
    const age = typeof e.t0 === 'number' ? Math.max(0, t - e.t0) : 0;
    const color = e.team === 2 || e.team === 3 ? teamColor(e.team) : '#f0a35e';
    if (e.kind === 'teleport') {
      if (e.ph === 'destination' && typeof e.ox === 'number') {
        const [ox, oy] = toScreen(e.ox, e.oy);
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
        ctx.setLineDash([]);
      }
      circle(x, y, (10 + 6 * pulse) * u);
      ctx.strokeStyle = 'rgba(106,163,240,' + (1 - pulse) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      circle(x, y, 7 * u);
      ctx.strokeStyle = color;
      ctx.stroke();
      if (e.ph === 'destination' && typeof e.te === 'number') label('TP ' + Math.ceil(remaining(e.te)), x, y - 17 * u, '#bfdbfe', 10);
      continue;
    }
    if (e.kind === 'scan') {
      circle(x, y, world(900));
      ctx.fillStyle = 'rgba(106,163,240,.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(106,163,240,' + (0.9 - pulse * 0.6) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      continue;
    }
    if (e.kind === 'smoke') {
      circle(x, y, 18 * u);
      ctx.fillStyle = 'rgba(148,163,184,.35)';
      ctx.fill();
      label('Smoke', x, y, '#e2e8f0', 9);
      continue;

    if (e.kind === 'innate') continue;
    const alpha = Math.max(0.35, 1 - age / 6) * (e.f ? 0.7 : 1);
    ctx.globalAlpha = alpha;
    circle(x, y, (6 + 4 * Math.min(1, age)) * u);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

function drawHero(h, t) {

  if (r.alive === false) return;
  if (r.f && !layers.fog) return;
  if (!r.f && !layers.heroes) return;
  const u = unit();
  const [x, y] = toScreen(h.cx, h.cy);
  const age = r.f && typeof r.seen === 'number' ? Math.max(0, t - r.seen) : 0;
  const alpha = r.f === 2 ? 0.45 : (r.f === 1 ? Math.max(0.5, 1 - age / 60) : 1);
  const s = 24 * u * cfg.look.heroScale / 100;
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,.6)';
  ctx.shadowBlur = 6;
  circle(x, y, s / 2 + 2.5);

  ctx.fill();

  if (typeof r.tp === 'number' && remaining(r.tp) > 0) {

}

function applyLayout() {

    const box = $(elId);

  }
  for (const id of Object.keys(PANELS)) {

    $(PANELS[id]).hidden = L.hidden.includes(id);
  }
  for (const elId of Object.values(SLOTS)) $(elId).classList.toggle('empty', ![...$(elId).children].some(c => !c.hidden));
  $('slotLeft').style.width = L.wl + 'px';
  $('slotRight').style.width = L.wr + 'px';
  const centerOn = !$('slotCenter').classList.contains('empty');
  $('gutL').classList.toggle('off', $('slotLeft').classList.contains('empty'));

function zonePanels(zone) {

function applyHeights() {
  const H = cfg.layout.h;
  for (const zoneId of ['slotLeft', 'slotCenter', 'slotRight']) {
    const zone = $(zoneId);
    zone.querySelectorAll(':scope > .hgut').forEach(g => g.remove());
    const cards = zonePanels(zone);
    const sized = cards.length > 1 && cards.every(c => H[panelId(c)] > 0);
    zone.classList.toggle('sized', sized);
    for (const c of cards) c.style.flex = sized ? H[panelId(c)] + ' 1 0px' : '';
    for (let i = 1; i < cards.length; i++) {
      const g = document.createElement('div');

function bindHgut(g, zone) {
  g.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    g.setPointerCapture(ev.pointerId);
    g.classList.add('drag');
    const cards = zonePanels(zone);
    for (const c of cards) cfg.layout.h[panelId(c)] = Math.max(60, Math.round(c.offsetHeight));
    const above = g.previousElementSibling, below = g.nextElementSibling;
    const a0 = cfg.layout.h[panelId(above)], b0 = cfg.layout.h[panelId(below)], y0 = ev.clientY;
    zone.classList.add('sized');
    for (const c of cards) c.style.flex = cfg.layout.h[panelId(c)] + ' 1 0px';
    const move = e => {
      const a = Math.max(60, Math.min(a0 + b0 - 60, a0 + e.clientY - y0));
      cfg.layout.h[panelId(above)] = a;
      cfg.layout.h[panelId(below)] = a0 + b0 - a;
      above.style.flex = a + ' 1 0px';
      below.style.flex = (a0 + b0 - a) + ' 1 0px';
      resize();
    };
    const up = () => {
      g.classList.remove('drag');
      g.removeEventListener('pointermove', move);
      g.removeEventListener('pointerup', up);
      saveCfg();
    };
    g.addEventListener('pointermove', move);
    g.addEventListener('pointerup', up);
  });
  g.addEventListener('dblclick', () => {
    for (const c of zonePanels(zone)) delete cfg.layout.h[panelId(c)];
    saveCfg();
    applyLayout();
  });
}

    h += '<h3>' + esc(CT.widths) + '</h3>' + ctlRange(CT.wl, 'layout.wl', 240, 640, 10, 'px') + ctlRange(CT.wr, 'layout.wr', 260, 720, 10, 'px');
    h += '<h3>' + esc(CT.objRows) + '</h3>' + Object.keys(cfg.objectives).map(k => ctlSwitch(CT.obj[k], 'objectives.' + k)).join('');
  } else if (drawerTab === 'map') {
    h += '<h3>' + esc(CT.mapLayers) + '</h3>' + LAYER_KEYS.map(([k]) => ctlSwitch(TEXT.layers[k], 'layers.' + k)).join('');
    h += '<h3>' + esc(CT.mapLook) + '</h3>' + ctlRange(CT.mapScale, 'look.mapScale', 60, 180, 5, '%') + ctlRange(CT.heroScale, 'look.heroScale', 60, 200, 5, '%') + ctlSwitch(CT.legend, 'look.legend');
  } else if (drawerTab === 'top') {
    h += '<h3>' + esc(CT.topParts) + '</h3>' + ['nw', 'heads', 'mana', 'numbers', 'ult', 'clock'].map(k => ctlSwitch(CT[k], 'top.' + k)).join('');
    h += ctlSeg(CT.corner, 'top.corner', [['lh', CT.cornerLh], ['kda', CT.cornerKda], ['nw', CT.cornerNw], ['none', CT.cornerNone]]);
  } else if (drawerTab === 'heroes') {
    h += '<h3>' + esc(CT.heroWho) + '</h3>' + ctlSeg(CT.heroWho, 'heroes.view', [['all', TEXT.viewAll], ['allies', TEXT.viewAllies], ['enemies', TEXT.viewEnemies]]) +
      ctlSeg(CT.heroOrder, 'heroes.order', [['mine', CT.orderMine], ['radiant', CT.orderRad]]) + ctlSwitch(TEXT.compactView, 'heroes.compact');
    h += '<h3>' + esc(CT.heroParts) + '</h3>' + [['name', CT.hName], ['state', CT.hState], ['bars', CT.hBars], ['kpis', CT.hKpis], ['attrs', CT.hAttrs], ['extra', CT.hExtra], ['items', CT.hItems], ['backpack', CT.hBackpack], ['abilities', CT.hAbilities]]
      .map(([k, t]) => ctlSwitch(t, 'heroes.' + k)).join('');
  } else if (drawerTab === 'events') {
    h += '<h3>' + esc(CT.evTypes) + '</h3>' + Object.keys(CT.ev).map(k => ctlSwitch(CT.ev[k], 'events.' + k)).join('');
    h += '<h3>' + esc(CT.evLook) + '</h3>' + ctlSwitch(CT.evIcons, 'events.icons') + ctlSwitch(CT.evNewest, 'events.newest');
  } else {
    h += '<h3>' + esc(CT.theme) + '</h3>' + ctlSeg(CT.theme, 'look.theme', [['dark', CT.themeDark], ['light', CT.themeLight], ['auto', CT.themeAuto]]) +
      ctlSeg(CT.density, 'look.density', [['normal', CT.densNormal], ['compact', CT.densCompact]]) + ctlRange(CT.zoom, 'look.zoom', 80, 130, 5, '%') +
      ctlSeg(CT.lang, 'lang', [['ru', 'Русский'], ['en', 'English']]);
    h += '<h3>' + esc(CT.colors) + '</h3>' + ctlColor(CT.radColor, 'look.rad') + ctlColor(CT.direColor, 'look.dire') +
      '<div class="row-c clickable" data-colors-reset="1"><span>' + esc(CT.colorsReset) + '</span><i class="fa-solid fa-rotate-left" style="color:var(--faint)"></i></div>';
  }
  $('drBody').innerHTML = h;
  $('cfgExport').lastChild.textContent = CT.exportCfg;
  $('cfgImport').lastChild.textContent = CT.importCfg;
  $('cfgReset').lastChild.textContent = CT.resetCfg;
}
const drawer = $('drawer');
function openDrawer(on) {
  drawer.classList.toggle('on', on);
  $('scrim').classList.toggle('on', on);
  if (on) renderDrawer();
}
$('custom').onclick = () => openDrawer(!drawer.classList.contains('on'));
$('drClose').onclick = () => openDrawer(false);
$('scrim').onclick = () => openDrawer(false);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') openDrawer(false); });
$('drTabs').onclick = ev => {
  const b = ev.target.closest('button[data-tab]');
  if (!b) return;
  drawerTab = b.dataset.tab;
  renderDrawer();
  $('drBody').scrollTop = 0;
};
function changed() {
  saveCfg();
  const scroll = $('drBody').scrollTop;
  applyAll();
  $('drBody').scrollTop = scroll;
}
$('drBody').onclick = ev => {
  const t = ev.target.closest('[data-toggle]');
  if (t) { setPath(t.dataset.toggle, !getPath(t.dataset.toggle)); changed(); return; }
  const s = ev.target.closest('[data-set]');
  if (s) {
    if (s.dataset.set === 'lang') { LANG = s.dataset.v; TEXT = ALL[LANG]; CT = CFG_TEXT[LANG]; localStorage.setItem('cr_lang', LANG); }
    else setPath(s.dataset.set, s.dataset.v);
    changed();
    return;
  }
  const hide = ev.target.closest('[data-hide]');
  if (hide) {
    const L = cfg.layout, id = hide.dataset.hide;
    L.hidden = L.hidden.includes(id) ? L.hidden.filter(x => x !== id) : L.hidden.concat(id);
    changed();
    return;
  }
  const pr = ev.target.closest('[data-preset]');
  if (pr) { cfg.layout = JSON.parse(JSON.stringify(PRESETS[pr.dataset.preset])); changed(); return; }
  if (ev.target.closest('[data-colors-reset]')) { cfg.look.rad = CFG_DEFAULT.look.rad; cfg.look.dire = CFG_DEFAULT.look.dire; changed(); }
};
$('drBody').oninput = ev => {
  const r = ev.target.closest('[data-range]');
  if (r) {
    setPath(r.dataset.range, Number(r.value));
    r.nextElementSibling.textContent = r.value + (r.dataset.range.indexOf('layout') === 0 ? 'px' : '%');
    saveCfg();
    applyLook();
    applyLayout();
    return;
  }
  const c = ev.target.closest('[data-color]');
  if (c) { setPath(c.dataset.color, c.value); saveCfg(); applyLook(); scoreHtml = ''; sideHtml = ''; renderSide(); }
};
let dragId = null;
$('drBody').addEventListener('dragstart', ev => {
  const c = ev.target.closest('.chip-p');
  if (!c) return;
  dragId = c.dataset.p;
  c.classList.add('dragging');
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', dragId);
});
$('drBody').addEventListener('dragend', () => { dragId = null; for (const b of document.querySelectorAll('.le-box.over')) b.classList.remove('over'); });
$('drBody').addEventListener('dragover', ev => {
  const box = ev.target.closest('.le-box');
  if (!box || !dragId) return;
  ev.preventDefault();
  for (const b of document.querySelectorAll('.le-box.over')) if (b !== box) b.classList.remove('over');
  box.classList.add('over');
});
$('drBody').addEventListener('drop', ev => {
  const box = ev.target.closest('.le-box');
  if (!box || !dragId) return;
  ev.preventDefault();
  const slot = box.dataset.slot, L = cfg.layout;
  const horizontal = slot === 'top';
  let index = 0;
  for (const c of box.querySelectorAll('.chip-p')) {
    if (c.dataset.p === dragId) continue;
    const r = c.getBoundingClientRect();
    if ((horizontal ? ev.clientX > r.left + r.width / 2 : ev.clientY > r.top + r.height / 2)) index++;
  }
  for (const k of Object.keys(SLOTS)) L[k] = L[k].filter(x => x !== dragId);
  L[slot].splice(index, 0, dragId);
  dragId = null;
  changed();
});
for (const [gutId, key, sign] of [['gutL', 'wl', 1], ['gutR', 'wr', -1]]) {
  const gut = $(gutId);
  gut.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    gut.setPointerCapture(ev.pointerId);
    gut.classList.add('drag');
    if (cfg.layout.auto) {
      cfg.layout.wl = Math.round($('slotLeft').offsetWidth) || cfg.layout.wl;
      cfg.layout.wr = Math.round($('slotRight').offsetWidth) || cfg.layout.wr;
      cfg.layout.auto = false;
      applyLayout();
    }
    const startX = ev.clientX, start = cfg.layout[key], other = key === 'wl' ? 'wr' : 'wl';
    const move = e => {
      const otherW = $(other === 'wl' ? 'slotLeft' : 'slotRight').classList.contains('empty') ? 0 : cfg.layout[other];
      const max = Math.max(200, $('slotCenter').parentElement.clientWidth - otherW - 24 - 280);
      cfg.layout[key] = Math.max(200, Math.min(max, Math.round(start + sign * (e.clientX - startX))));
      $(key === 'wl' ? 'slotLeft' : 'slotRight').style.width = cfg.layout[key] + 'px';
      resize();
    };
    const up = () => {
      gut.classList.remove('drag');
      gut.removeEventListener('pointermove', move);
      gut.removeEventListener('pointerup', up);
      saveCfg();
      if (drawer.classList.contains('on')) renderDrawer();
    };
    gut.addEventListener('pointermove', move);
    gut.addEventListener('pointerup', up);
  });
  gut.addEventListener('dblclick', () => { cfg.layout.wl = CFG_DEFAULT.layout.wl; cfg.layout.wr = CFG_DEFAULT.layout.wr; cfg.layout.auto = true; saveCfg(); applyLayout(); });
}
function toast(text) {
  const t = $('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('on'), 2200);
}
$('cfgExport').onclick = async () => {
  const text = JSON.stringify(cfg);
  try { await navigator.clipboard.writeText(text); toast(CT.copied); } catch (e) { window.prompt(CT.exportCfg, text); }
};
$('cfgImport').onclick = () => {
  const text = window.prompt(CT.pastePrompt, '');
  if (!text) return;
  try { cfg = mergeCfg(CFG_DEFAULT, JSON.parse(text)); saveCfg(); location.reload(); } catch (e) { toast(CT.badCfg); }
};
$('cfgReset').onclick = () => {
  if (!window.confirm(CT.resetAsk)) return;
  localStorage.removeItem('cr_cfg');
  localStorage.removeItem('cr_layers');
  localStorage.removeItem('cr_team_view');
  localStorage.removeItem('cr_theme');
  location.reload();
};
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (cfg.look.theme === 'auto') applyLook(); });

applyLook();
applyClasses();
applyLayout();
applyText();

if (/^[A-Za-z0-9]{20}$/.test(sessionId)) {
  $('statusText').textContent = TEXT.connecting;
  const db = getDatabase(initializeApp(firebaseConfig));
  const base = 'sessions/' + sessionId;
  onValue(ref(db, '.info/connected'), snap => { connected = snap.val() === true; refreshStatus(); });
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  onValue(ref(db, base + '/meta'), snap => {
    meta = snap.val();
    if (meta) metaSeen = true;
    if (!meta) { live = {}; applyLive(); }
    refreshStatus();
  }, () => { meta = null; refreshStatus(); });
  onValue(ref(db, base + '/live'), snap => { live = snap.val() || {}; applyLive(); refreshStatus(); }, () => {});
  const feed = query(ref(db, base + '/feed'), limitToLast(100));
  const atBottom = () => logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  onChildAdded(feed, snap => { const stick = !cfg.events.newest && atBottom(); feedLine(snap.key, snap.val() || {}); if (stick) logEl.scrollTop = logEl.scrollHeight; });
  onChildChanged(feed, snap => feedLine(snap.key, snap.val() || {}));
  onChildRemoved(feed, snap => { const line = feedLines.get(snap.key); if (line) line.remove(); feedLines.delete(snap.key); feedData.delete(snap.key); });
} else {
  connected = true;
}
refreshStatus();
setInterval(function () { refreshStatus(); renderSide(); renderObjs(); }, 1000);

try {
  const wurl = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' }));
  new Worker(wurl).onmessage = frame;
} catch (e) {
  setInterval(frame, 33);
}
window.addEventListener('hashchange', () => location.reload());

const popBtn = $('popcon');
if (!window.documentPictureInPicture) popBtn.style.display = 'none';
popBtn.onclick = async function () {
  try {
    if (consoleEl.ownerDocument !== document) {
      window.documentPictureInPicture.window.close();
      return;
    }
    const w = await window.documentPictureInPicture.requestWindow({ width: 420, height: 420 });
    for (const st of document.querySelectorAll('style, link[rel="stylesheet"]')) w.document.head.appendChild(st.cloneNode(true));
    w.document.documentElement.className = document.documentElement.className;
    w.document.body.style.cssText = 'margin:0;height:100vh;background:var(--bg);display:flex';
    const parent = consoleEl.parentNode, after = consoleEl.nextSibling;
    consoleEl.classList.add('pop');
    w.document.body.appendChild(consoleEl);
    w.addEventListener('pagehide', function () {
      consoleEl.classList.remove('pop');
      parent.insertBefore(consoleEl, after);
    });
  } catch (e) {
    $('statusText').textContent = TEXT.noWindow + e.message;
  }
};

let pipVideo = null;
openPip = async function () {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    if (!pipVideo) {
      pipVideo = document.createElement('video');
      pipVideo.muted = true;
      pipVideo.playsInline = true;
      pipVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(pipVideo);
      pipVideo.srcObject = canvas.captureStream(30);
    }
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
  } catch (e) {
    $('statusText').textContent = TEXT.noWindow + e.message;
  }
};
</script>
</body>
</html>
