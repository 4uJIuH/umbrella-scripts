<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cloud Radar · Umbrella Scripts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--sec:#efefec;--border:#e2e2de;--soft:#ebebe8;--fg:#18181a;--muted:#62626a;--faint:#9a9aa1;--ok:#2f9a5e;--warn:#b07d1c;--bad:#c93c3c;--accent:#18181a;--accent-fg:#fff;
  --rad:#2f9a5e;--dire:#c93c3c;--gold:#b07d1c;--blue:#2f6fd0;--violet:#7c4dcc;--mapbg:#16181b;--hp:#2f9a5e;--mp:#2f6fd0}
.dark{--bg:#0c0c0d;--card:#121214;--sec:#19191c;--border:#222225;--soft:#1a1a1d;--fg:#ececee;--muted:#9a9aa1;--faint:#616168;--ok:#57c785;--warn:#d9a84e;--bad:#ef6b6b;--accent:#ececee;--accent-fg:#0c0c0d;
  --rad:#57c785;--dire:#ef6b6b;--gold:#d9a84e;--blue:#6aa3f0;--violet:#b394f0;--mapbg:#0f1012;--hp:#4cb879;--mp:#4f8fe8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{border-bottom:1px solid var(--soft);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);z-index:5;flex:none}
.bar{display:flex;align-items:center;height:56px;gap:16px;padding:0 20px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:13px}
.crumb{color:var(--faint);display:flex;align-items:center;gap:10px;font-weight:500;white-space:nowrap}
.crumb b{color:var(--fg);font-weight:600}
.sp{flex:1}
.chip{height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip.ok .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.chip.warn .dot{background:var(--warn)}
.chip.bad .dot{background:var(--bad)}
#clock{color:var(--fg);font-weight:600}
#clock:empty{display:none}
.ghost{height:32px;padding:0 10px;border-radius:8px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;font-weight:500;transition:.15s;white-space:nowrap}
.ghost:hover,.ghost.on{color:var(--fg);background:var(--sec)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{height:26px;padding:0 8px;border-radius:6px;color:var(--faint);font-size:12px;font-weight:600;transition:color .2s,background .2s}
.seg button.on{color:var(--fg);background:var(--sec)}
main{flex:1;min-height:0;display:grid;gap:12px;padding:12px 20px 16px;grid-template-columns:320px minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"score score score" "feed map teams"}
#scoreCard{grid-area:score;overflow:visible}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--soft);flex:none}
.card-h h2{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.card-h h2 i{color:var(--faint);font-size:12px}
.card-h .sp{flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;color:var(--faint);display:grid;place-items:center;transition:.15s}
.icon-btn:hover{color:var(--fg);background:var(--sec)}
#feedCol{grid-area:feed;display:flex;flex-direction:column;gap:12px;min-height:0}
#mapCard{grid-area:map}
#teamsCard{grid-area:teams;position:relative;overflow:visible}
#teams{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;border-radius:0 0 12px 12px}
#teamsCard .opts{top:48px;right:10px;width:220px}
.tgroup + .tgroup{border-top:1px solid var(--border)}
.objs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--soft)}
.obj{background:var(--card);padding:10px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.obj img,.obj > i{width:30px;height:30px;flex:none;object-fit:contain;border-radius:8px;display:grid;place-items:center;font-size:13px}
.obj img{background:#1a1a1d;padding:4px}
.obj > i{background:var(--sec);color:var(--muted)}
.obj .k{font-size:11.5px;color:var(--faint);line-height:1.2}
.obj .v{font-size:13px;font-weight:600;line-height:1.3}
.obj .v.ok{color:var(--ok)} .obj .v.bad{color:var(--bad)} .obj .v.warn{color:var(--warn)}
#console{flex:1;min-height:200px}
#console.pop{height:100vh;border-radius:0;border:0}
#log{flex:1;overflow:auto;padding:6px 0;scrollbar-width:thin}
#log:empty::after{content:attr(data-empty);display:block;color:var(--faint);font-size:13px;padding:12px 14px}
.ev{display:grid;grid-template-columns:40px 20px 1fr;gap:8px;align-items:start;padding:5px 14px 5px 11px;border-left:3px solid transparent;font-size:13px;line-height:1.4}
.ev:hover{background:var(--sec)}
.ev .t{color:var(--faint);font-size:11.5px;padding-top:1px}
.ev img{width:20px;height:20px;border-radius:5px;object-fit:contain;background:#1a1a1d;padding:1px}
.ev .x{color:var(--muted)}
.ev .x b{color:var(--fg);font-weight:600}
.ev.a{border-left-color:var(--rad)} .ev.e{border-left-color:var(--dire)} .ev.boss{border-left-color:var(--gold)} .ev.rune{border-left-color:var(--violet)} .ev.scan{border-left-color:var(--blue)} .ev.smoke{border-left-color:var(--faint)}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:end;gap:18px;padding:10px 16px 12px;max-width:1280px;width:100%;margin:0 auto}
.sb-team{display:flex;flex-direction:column;gap:7px;min-width:0}
.sb-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint);font-weight:500;padding:0 2px}
.sb-team.d .sb-head{flex-direction:row-reverse}
.sb-head .flag{width:8px;height:8px;border-radius:2px}
.sb-head b{font-size:13px;color:var(--fg);font-weight:600}
.sb-head .gold{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--fg)}
.sb-team.d .sb-head .gold{margin-left:0;margin-right:auto}
.sb-head .gold img{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sb-team.d .tiles{direction:rtl}
.sb-team.d .tile{direction:ltr}
.tile{min-width:0;display:flex;flex-direction:column;gap:3px;cursor:pointer;border-radius:8px;transition:transform .15s}
.tile:hover{transform:translateY(-1px)}
.tile.empty{visibility:hidden}
.pt{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:#1a1a1d;box-shadow:inset 0 2px 0 var(--tc)}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt::before{content:'';position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.78));z-index:1}
.pt .lv,.pt .k{position:absolute;bottom:2px;z-index:2;font-size:10.5px;font-weight:700;color:#fff;line-height:1.2}
.pt .lv{left:4px}
.pt .k{right:4px;color:#e4e4e7}
.pt .ul{position:absolute;top:4px;right:4px;z-index:2;min-width:9px;height:9px;border-radius:5px;background:#f5c542;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 8px rgba(245,197,66,.8)}
.pt .ul.cd{min-width:18px;height:14px;top:3px;right:3px;padding:0 4px;background:rgba(0,0,0,.72);box-shadow:none;color:#d4d4d8;font-size:9px;font-weight:700;line-height:14px;text-align:center}
.pt .dt{position:absolute;inset:0;z-index:3;display:none;place-items:center;background:rgba(0,0,0,.62);color:#fff;font-weight:700;font-size:16px}
.tile.dead .pt img{filter:grayscale(1) brightness(.55)} .tile.dead .dt{display:grid}
.tile.fog .pt img{filter:saturate(.35) brightness(.7)}
.tile.fog .pt::after{content:'';position:absolute;inset:0;z-index:2;border:1.5px dashed #e0b44a;border-radius:6px}
.hb,.mb{position:relative;border-radius:3px;background:var(--sec);overflow:hidden}
.hb{height:13px} .mb{height:9px}
.hb i,.mb i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.hb i{background:var(--hp)} .mb i{background:var(--mp)}
.hb b,.mb b{position:absolute;inset:0;font-weight:700;text-align:center;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.8)}
.hb b{font-size:9.5px;line-height:13px} .mb b{font-size:8px;line-height:9px}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:6px;min-width:150px}
.score{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700;line-height:1}
.score .r{color:var(--rad)} .score .d{color:var(--dire)}
.score i{font-style:normal;color:var(--faint);font-size:20px;font-weight:500}
.daybox{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;background:var(--sec);font-size:13px;font-weight:700}
.daybox i.day{color:#f5c542} .daybox i.night{color:#8fa8ff}
.daybox span{font-size:11px;color:var(--faint);font-weight:500}
.gear{position:absolute;right:20px;top:20px;z-index:3;width:28px;height:28px;border-radius:8px;color:var(--faint);display:grid;place-items:center;transition:.15s;background:var(--card);border:1px solid var(--border)}
.gear:hover,.gear.on{color:var(--fg)}
.opts{position:absolute;right:20px;top:54px;z-index:20;width:260px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:8px;display:none}
.opts.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}}
.opts h3{font-size:11.5px;font-weight:600;color:var(--faint);padding:6px 8px 4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);text-align:left}
.opt:hover{background:var(--sec);color:var(--fg)}
.opt i{width:16px;text-align:center;color:var(--faint);font-size:12px}
.opt span{flex:1}
.sw{width:30px;height:18px;border-radius:9px;background:var(--border);position:relative;transition:.15s;flex:none}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.opt.on .sw{background:var(--ok)} .opt.on .sw::after{left:14px}
.opt.on{color:var(--fg)}
.opts .sep{height:1px;background:var(--soft);margin:6px 4px}
.mapbtns{display:flex;gap:4px;padding:2px 4px}
.mapbtns button{flex:1;height:30px;border-radius:8px;background:var(--sec);color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mapbtns button:hover{color:var(--fg)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--mapbg)}
#map{border-radius:10px;display:block}
#marks{position:absolute;pointer-events:none;overflow:hidden;border-radius:10px}
#marks img{position:absolute;border-radius:50%;box-shadow:0 0 0 2px var(--c),0 2px 8px rgba(0,0,0,.7);transform:translate(-50%,-50%)}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#empty.on{display:flex}
#empty div{background:rgba(12,12,13,.82);border:1px solid rgba(255,255,255,.08);color:#d4d4d8;border-radius:12px;padding:14px 18px;display:flex;gap:12px;align-items:center;font-weight:500;backdrop-filter:blur(6px)}
#empty i{color:#9a9aa1}
.legend{display:flex;gap:16px;padding:10px 14px;border-top:1px solid var(--soft);font-size:12px;color:var(--faint);flex:none;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.team-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--soft);position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(6px)}
#teams:empty::after{content:attr(data-empty);display:block;color:var(--faint);font-size:13px;padding:14px}
.team-h .flag{width:8px;height:8px;border-radius:2px}
.team-h h2{font-size:13px;font-weight:600}
.team-h .role{font-size:12px;color:var(--faint);font-weight:500}
.team-h .sum{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--faint)}
.team-h .sum b{color:var(--fg);font-weight:600}
.hero{padding:12px 14px;border-top:1px solid var(--soft);transition:background .4s}
.hero.flash{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.hero .who{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.hero .pn{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attrs{display:grid;grid-template-columns:repeat(3,1fr) repeat(4,1fr);gap:1px;margin-top:6px;background:var(--soft);border-radius:8px;overflow:hidden;font-size:11.5px}
.attrs div{background:var(--card);padding:3px 0;text-align:center;font-weight:600;white-space:nowrap}
.attrs div i{font-size:9.5px;margin-right:3px;color:var(--faint)}
.attrs .pri{background:var(--sec)}
.attrs .s i{color:#e0574f} .attrs .g i{color:#4cb879} .attrs .n i{color:#4f8fe8}
.extra{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px;color:var(--faint)}
.extra b{color:var(--muted);font-weight:600}
.team-h + .hero{border-top:0}
.hero .top{display:flex;align-items:center;gap:10px}
.portrait{position:relative;width:32px;height:32px;flex:none;border-radius:8px;background:#1a1a1d}
.portrait img{width:100%;height:100%;border-radius:8px;object-fit:contain;display:block;padding:2px}
.portrait .lv{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:16px;padding:0 4px;border-radius:5px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center}
.hero .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:6px;background:var(--sec);color:var(--muted);white-space:nowrap}
.state.fog{color:var(--warn)} .state.dead{color:var(--bad)} .state.tp{color:var(--blue)} .state.vis{color:var(--ok)}
.bars{display:grid;gap:3px;margin-top:9px}
.meter{position:relative;height:12px;border-radius:4px;background:var(--sec);overflow:hidden}
.meter.thin{height:6px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter.hp i{background:var(--hp)} .meter.mp i{background:var(--mp)}
.meter b{position:absolute;inset:0;font-size:9px;font-weight:600;line-height:12px;text-align:center;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.6)}
.kpis{display:grid;gap:1px;margin-top:9px;background:var(--soft);border-radius:8px;overflow:hidden}
.kpis div{background:var(--sec);padding:4px 0;text-align:center}
.kpis span{display:block;font-size:10px;color:var(--faint);line-height:1.3}
.kpis b{font-size:12px;font-weight:600}
.slots{display:flex;gap:3px;margin-top:8px;align-items:center}
.slot{position:relative;width:36px;height:26px;border-radius:5px;background:var(--sec);overflow:hidden;flex:none}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.sm{width:27px;height:20px;opacity:.7}
.slot.nt{width:26px;height:26px;border-radius:50%;margin-left:4px}
.slot.old img{filter:grayscale(.8) brightness(.7)}
.slot em{display:none;position:absolute;inset:0;font:600 7px/1.1 Inter,sans-serif;color:var(--faint);padding:2px;overflow:hidden;font-style:normal}
.slot.noimg em{display:block}
.slot .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.slot .ch{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.slot.ab{width:28px;height:28px}
.slot.ab.l0 img{filter:grayscale(1) brightness(.4)}
.slot .pips{position:absolute;left:2px;right:2px;bottom:2px;display:flex;gap:1px}
.slot .pips i{flex:1;height:2px;background:var(--gold);border-radius:1px}
.slots .gap{width:6px}
.hero.fogrow .portrait img{filter:saturate(.5)}
.hero.deadrow{opacity:.55}
.hero.deadrow .portrait img{filter:grayscale(1)}
@media (max-width:1320px){main{grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"score score" "map teams" "feed teams";grid-template-rows:auto minmax(0,1fr) 300px}#feedCol{flex-direction:row}#feedCol > *{flex:1}}
@media (max-width:900px){html,body{height:auto}main{display:flex;flex-direction:column}#mapCard{height:min(100vw,640px)}#feedCol{flex-direction:column}#console{height:320px;flex:none}.sb{flex-wrap:wrap;justify-content:center}.sb-team{flex:1 1 100%}.sb-mid{order:-1}.crumb,.gh{display:none}.bar{gap:8px;padding:0 12px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="./#/"><i class="fa-solid fa-umbrella"></i>Umbrella Scripts</a>
  <div class="crumb"><i class="fa-solid fa-chevron-right" style="font-size:10px"></i><b>Cloud Radar</b></div>
  <div class="chip" id="status"><span class="dot"></span><span id="statusText"></span></div>
  <div class="chip" id="clock"></div>
  <div class="sp"></div>
  <div class="seg" id="lang"><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  <button class="ghost" id="theme"><i class="fa-solid fa-moon"></i></button>
  <a class="ghost" href="https://github.com/4uJIuH/umbrella-scripts" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i><span class="gh">GitHub</span></a>
</div></header>
<main>
  <section class="card" id="scoreCard"><div class="sb" id="score"></div></section>
  <section id="feedCol">
    <div class="card"><div class="card-h"><h2><i class="fa-solid fa-crosshairs"></i><span id="hObj"></span></h2></div><div class="objs" id="objs"></div></div>
    <div class="card" id="console"><div class="card-h"><h2><i class="fa-solid fa-list-ul"></i><span id="hLog"></span></h2><div class="sp"></div><button class="icon-btn" id="popcon" type="button"><i class="fa-solid fa-up-right-from-square"></i></button></div><div id="log"></div></div>
  </section>
  <section class="card" id="mapCard">
    <div id="stage"><button class="gear" id="gear" type="button"><i class="fa-solid fa-gear"></i></button><div class="opts" id="opts"></div><canvas id="map"></canvas><div id="marks"></div><div id="empty"><div><i class="fa-solid fa-satellite-dish"></i><span id="emptyText"></span></div></div></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card" id="teamsCard"><div class="card-h"><h2><i class="fa-solid fa-users"></i><span id="hTeams"></span></h2><div class="sp"></div><button class="icon-btn" id="teamGear" type="button"><i class="fa-solid fa-gear"></i></button></div><div class="opts" id="teamOpts"></div><div id="teams"></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, query, limitToLast, onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGf2e4CIJm1or0klbzXXI5wlfvXPqS514",
  authDomain: "umbrella-scripts.firebaseapp.com",
  databaseURL: "https://umbrella-scripts-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "umbrella-scripts",
};

const ALL = {
  en: {

function drawUnits() {

  for (const row of list(live.units)) {
    if (typeof row.x !== 'number') continue;
    const [x, y] = toScreen(row.x, row.y);
    const kind = row.kind;
    if (kind === 'building') {
      if (!layers.buildings) continue;
      ctx.globalAlpha = row.f ? 0.55 : 1;
      circle(x, y, 7 * u);
      ctx.fillStyle = teamColor(row.team, 0.9);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)';
      ctx.lineWidth = 1;
      ctx.stroke();
      drawIcon(TOWER_ICON, x, y, 11 * u);
      if (typeof row.hp === 'number' && row.hp < 100) {
        ctx.beginPath();
        ctx.arc(x, y, 9.5 * u, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * row.hp / 100);
        ctx.strokeStyle = row.hp > 50 ? '#bbf7d0' : (row.hp > 25 ? '#fde68a' : '#fecaca');
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else if (kind === 'wave') {
      if (!layers.waves) continue;
      const dx = (row.dx || 0) / 100, dy = (row.dy || 0) / 100;
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = teamColor(row.team);
      ctx.lineWidth = 1.6;
      for (let i = 0; i < 4; i++) {
        const along = (i - 1.5) * world(110), side = (i % 2 ? 1 : -1) * world(60);
        circle(x + dx * along - dy * side, y - dy * along - dx * side, 3.2 * u);
        ctx.stroke();
      }
    } else if (kind === 'creep') {
      if (!layers.creeps) continue;
      const r = (row.s ? 3.6 : 2.6) * u;
      if (row.f === 2) {
        ctx.globalAlpha = 0.85;
        circle(x, y, r);
        ctx.strokeStyle = teamColor(row.team);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else {
        ctx.globalAlpha = 1;
        if (row.s) { ctx.beginPath(); ctx.rect(x - r, y - r, r * 2, r * 2); } else circle(x, y, r);
        ctx.fillStyle = teamColor(row.team);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.6)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else if (kind === 'neutral') {
      if (!layers.jungle) continue;
      ctx.globalAlpha = row.f ? 0.35 : 0.95;
      circle(x, y, 2.3 * u);
      ctx.fillStyle = '#d9a84e';
      ctx.fill();
    } else if (kind === 'courier') {
      if (!layers.couriers) continue;
      ctx.globalAlpha = row.f ? 0.45 : 1;
      ctx.beginPath();
      ctx.moveTo(x, y - 5 * u); ctx.lineTo(x + 4 * u, y); ctx.lineTo(x, y + 5 * u); ctx.lineTo(x - 4 * u, y); ctx.closePath();
      ctx.fillStyle = teamColor(row.team);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (kind === 'roshan') {
      ctx.globalAlpha = 1;
      drawIcon('roshan.png', x, y, 22 * u);
    } else if (kind === 'tormentor') {
      ctx.globalAlpha = row.f ? 0.6 : 1;
      drawIcon(TORM_ICON(row.x + row.y < 0 ? 'radiant' : 'dire'), x, y, 20 * u);
    } else if (kind === 'wisdom') {
      ctx.globalAlpha = row.f ? 0.6 : 1;
      drawIcon('Wisdom.png', x, y, 18 * u);
    }
  }
  ctx.globalAlpha = 1;
}

function drawWards() {
  if (!layers.wards) return;
  const u = unit();
  for (const w of list(live.wards)) {
    const [x, y] = toScreen(w.x, w.y);
    const sentry = w.kind === 'sentry';
    ctx.globalAlpha = w.f ? 0.6 : 1;
    circle(x, y, 8 * u);
    ctx.fillStyle = teamColor(w.team, 0.85);
    ctx.fill();
    if (!drawIcon(sentry ? 'centry_ward.png' : 'Observer_ward.png', x, y, 14 * u)) {
      circle(x, y, 4 * u);
      ctx.fillStyle = sentry ? '#6aa3f0' : '#facc15';
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (typeof w.e === 'number' && w.team !== (live.clock || {}).team) {
      const left = remaining(w.e);
      if (left > 0) label(clockText(left), x, y + 15 * u, '#f3d48c', 9);
    }
  }
}

function drawRunes() {
  if (!layers.runes) return;
  const u = unit();
  for (const r of list(live.runes)) {
    const [x, y] = toScreen(r.x, r.y);
    ctx.globalAlpha = r.f ? 0.45 : 1;
    if (!(RUNE_ICONS[r.rune_type] && drawIcon(RUNE_ICONS[r.rune_type], x, y, 16 * u))) {
      ctx.fillStyle = '#b394f0';
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 5, y); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

let marks = [];
function drawEvents() {
  if (!layers.events) return;
  const u = unit();
  const t = gameTime();
  const pulse = (performance.now() % 1200) / 1200;
  for (const e of list(live.events)) {
    const [x, y] = toScreen(e.x, e.y);
    const age = typeof e.t0 === 'number' ? Math.max(0, t - e.t0) : 0;
    const color = e.team === 2 || e.team === 3 ? teamColor(e.team) : '#f0a35e';
    if (e.kind === 'teleport') {
      if (e.ph === 'destination' && typeof e.ox === 'number') {
        const [ox, oy] = toScreen(e.ox, e.oy);
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
        ctx.setLineDash([]);
      }
      circle(x, y, (10 + 6 * pulse) * u);
      ctx.strokeStyle = 'rgba(106,163,240,' + (1 - pulse) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      circle(x, y, 7 * u);
      ctx.strokeStyle = color;
      ctx.stroke();
      if (e.ph === 'destination' && typeof e.te === 'number') label('TP ' + Math.ceil(remaining(e.te)), x, y - 17 * u, '#bfdbfe', 10);
      continue;
    }
    if (e.kind === 'scan') {
      circle(x, y, world(900));
      ctx.fillStyle = 'rgba(106,163,240,.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(106,163,240,' + (0.9 - pulse * 0.6) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      continue;
    }
    if (e.kind === 'smoke') {
      circle(x, y, 18 * u);
      ctx.fillStyle = 'rgba(148,163,184,.35)';
      ctx.fill();
      label('Smoke', x, y, '#e2e8f0', 9);
      continue;
    }
    if (e.kind === 'innate') continue;
    const alpha = Math.max(0.35, 1 - age / 6) * (e.f ? 0.7 : 1);
    ctx.globalAlpha = alpha;
    circle(x, y, (6 + 4 * Math.min(1, age)) * u);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    circle(x, y, 2.5 * u);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (e.a && !document.pictureInPictureElement) marks.push({ src: abilityImg(e.a), x: x, y: y - 17 * u, s: 20 * u, c: color, o: alpha, t: abilityName(e.a, e.h) });
    else if (e.a) label(abilityName(e.a, e.h), x, y - 15 * u, '#fed7aa', 10);
  }
}

function drawHero(h, t) {
  const r = h.row;
  if (r.alive === false) return;
  if (r.f && !layers.fog) return;
  if (!r.f && !layers.heroes) return;
  const u = unit();
  const [x, y] = toScreen(h.cx, h.cy);
  const age = r.f && typeof r.seen === 'number' ? Math.max(0, t - r.seen) : 0;
  const alpha = r.f === 2 ? 0.45 : (r.f === 1 ? Math.max(0.5, 1 - age / 60) : 1);
  const s = 24 * u;
  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,.6)';
  ctx.shadowBlur = 6;
  circle(x, y, s / 2 + 2.5);
  ctx.fillStyle = 'rgba(12,12,13,.9)';
  ctx.fill();
  ctx.shadowBlur = 0;
  if (!drawIcon(heroImg(r.name), x, y, s, true)) {
    circle(x, y, s / 2);
    ctx.fillStyle = teamColor(r.team);
    ctx.fill();
  }
  circle(x, y, s / 2 + 1.5);
  ctx.lineWidth = r.me ? 3 : 2;
  ctx.strokeStyle = r.me ? '#ffffff' : teamColor(r.team);
  if (r.f) { ctx.setLineDash([4, 3]); ctx.strokeStyle = r.f === 1 ? '#e0b44a' : '#94a3b8'; }
  ctx.stroke();
  ctx.setLineDash([]);
  if (!r.f && r.max_hp > 0 && r.hp >= 0) {
    const w = s + 6, top = y + s / 2 + 4;
    const k = Math.max(0, Math.min(1, r.hp / r.max_hp));
    ctx.fillStyle = 'rgba(12,12,13,.85)';
    ctx.beginPath(); ctx.roundRect(x - w / 2 - 1, top - 1, w + 2, r.max_mana > 0 ? 8 : 6, 2); ctx.fill();
    ctx.fillStyle = k > 0.5 ? '#4cb879' : (k > 0.25 ? '#e0b44a' : '#ef6b6b');
    ctx.fillRect(x - w / 2, top, w * k, 4);
    if (r.max_mana > 0) {
      ctx.fillStyle = '#4f8fe8';
      ctx.fillRect(x - w / 2, top + 5, w * Math.max(0, Math.min(1, r.mana / r.max_mana)), 2);
    }
  }
  ctx.globalAlpha = 1;
  if (r.f && layers.labels) label(Math.round(age) + 's', x + s / 2 + 8, y - s / 2, r.f === 1 ? '#f3d48c' : '#cbd5e1', 9);
  if (typeof r.tp === 'number' && remaining(r.tp) > 0) {
    ctx.beginPath();
    ctx.arc(x, y, s / 2 + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ((performance.now() / 700) % 1));
    ctx.strokeStyle = '#6aa3f0';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

const marksEl = $('marks');
const markPool = [];
function syncMarks() {
  marksEl.style.left = canvas.offsetLeft + 'px';
  marksEl.style.top = canvas.offsetTop + 'px';
  marksEl.style.width = size + 'px';
  marksEl.style.height = size + 'px';
  marks.forEach((m, i) => {
    let im = markPool[i];
    if (!im) { im = markPool[i] = document.createElement('img'); im.alt = ''; im.onerror = () => { im.style.visibility = 'hidden'; }; marksEl.appendChild(im); }
    if (im.dataset.src !== m.src) { im.dataset.src = m.src; im.style.visibility = ''; im.src = m.src; }
    im.style.display = '';
    im.style.left = m.x + 'px';
    im.style.top = m.y + 'px';
    im.style.width = im.style.height = m.s + 'px';
    im.style.opacity = m.o;
    im.style.setProperty('--c', m.c);
    im.title = m.t;
  });
  for (let i = marks.length; i < markPool.length; i++) markPool[i].style.display = 'none';
}

let lastFrame = performance.now();
function frame() {
  marks = [];
  const nowMs = performance.now();
  const k = 1 - Math.exp(-Math.min(0.1, (nowMs - lastFrame) / 1000) * 12);
  lastFrame = nowMs;
  drawMap();
  drawVision();
  drawCamps();
  drawUnits();
  drawWards();
  drawRunes();
  drawEvents();
  const t = gameTime();
  const ids = Object.keys(heroes).sort((a, b) => (heroes[b].row.f || 0) - (heroes[a].row.f || 0));
  for (const id of ids) {
    const h = heroes[id];
    h.cx += (h.row.x - h.cx) * k;
    h.cy += (h.row.y - h.cy) * k;
    drawHero(h, t);
  }
  syncMarks();
}

function pct(a, b) {
  return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
}
function kilo(v) {
  return v >= 1000 ? (Math.round(v / 100) / 10) + 'k' : String(Math.round(v));
}

function slot(src, title, opts) {
  opts = opts || {};
  const cd = opts.cd > 0.5 ? '<span class="cd">' + Math.ceil(opts.cd) + '</span>' : '';
  const ch = opts.charges ? '<span class="ch">' + esc(opts.charges) + '</span>' : '';
  const pips = opts.level ? '<span class="pips">' + '<i></i>'.repeat(Math.min(opts.level, 7)) + '</span>' : '';
  return '<span class="slot ' + (opts.cls || '') + '" title="' + esc(title) + '"><img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()"><em>' + esc(title) + '</em>' + cd + ch + pips + '</span>';
}

function heroCard(entry) {
  const r = entry.row, info = entry.info || {};

  let note, noteCls;
  if (r.alive === false) { note = r.respawn_at ? fmt(TEXT.deadIn, { n: Math.ceil(remaining(r.respawn_at)) }) : TEXT.dead; noteCls = 'dead'; }
  else if (typeof r.tp === 'number' && remaining(r.tp) > 0) { note = fmt(TEXT.tp, { n: Math.ceil(remaining(r.tp)) }); noteCls = 'tp'; }
  else if (r.f) { note = fmt(r.f === 1 ? TEXT.maphack : TEXT.lastSeen, { n: Math.round(Math.max(0, t - (r.seen || t))) }); noteCls = 'fog'; }
  else { note = TEXT.visible; noteCls = 'vis'; }
  const s = info.stats || {};
  const kpis = [];
  if (typeof s.k === 'number') kpis.push([TEXT.kda, s.k + '/' + s.d + (typeof s.a === 'number' ? '/' + s.a : '') + (s.est ? '*' : '')]);
  if (typeof s.nw === 'number') kpis.push([TEXT.nw, (s.partial ? '≥' : '') + kilo(s.nw)]);
  if (typeof s.lh === 'number') kpis.push([TEXT.lhdn, s.lh + '/' + (s.dn || 0)]);
  if (typeof s.g === 'number') kpis.push([TEXT.gold, String(s.g)]);
  if (info.buyback && kpis.length < 4) kpis.push([TEXT.buyback, secs(remaining(info.buyback.ready_at))]);
  const items = list(info.items);
  const bySlot = {};
  for (const it of items) bySlot[it.slot] = it;
  let inv = '';
  for (let i = 0; i < 6; i++) {
    const it = bySlot[i];
    inv += it ? slot(itemImg(it.name), itemName(it.name), { cd: remaining(it.ready_at), charges: it.charges, cls: it.o ? 'old' : '' }) : '<span class="slot"></span>';
  }
  if (bySlot[16]) inv += slot(itemImg(bySlot[16].name), itemName(bySlot[16].name), { cd: remaining(bySlot[16].ready_at), cls: 'nt' + (bySlot[16].o ? ' old' : '') });
  let back = '';
  for (const i of [6, 7, 8]) if (bySlot[i]) back += slot(itemImg(bySlot[i].name), itemName(bySlot[i].name), { cd: remaining(bySlot[i].ready_at), cls: 'sm' });
  if (bySlot[15]) back += '<span class="gap"></span>' + slot(itemImg(bySlot[15].name), itemName(bySlot[15].name), { cd: remaining(bySlot[15].ready_at), cls: 'sm' });
  const own = heroKey(r.name) + '_';
  const abilities = list(info.abilities).filter(a => String(a.name || '').indexOf(own) === 0).map(a => slot(abilityImg(a.name), abilityName(a.name, r.name) + (a.level ? ' (' + a.level + ')' : ''),
    { cd: remaining(a.ready_at), level: a.level, charges: a.charges, cls: 'ab' + (a.level ? '' : ' l0') })).join('');
  const a = info.attr;
  let attrs = '';
  if (a) {
    const cell = (cls, ic, val, title, pri) => '<div class="' + cls + (pri ? ' pri' : '') + '" title="' + esc(title) + '"><i class="fa-solid ' + ic + '"></i>' + esc(val == null ? '—' : val) + '</div>';
    attrs = '<div class="attrs">' + cell('s', 'fa-hand-fist', a.s, 'STR', a.p === 0) + cell('g', 'fa-person-running', a.g, 'AGI', a.p === 1) + cell('n', 'fa-brain', a.i, 'INT', a.p === 2) +
      cell('', 'fa-khanda', a.dmg != null ? a.dmg + (a.dmx > a.dmg ? '+' : '') : null, TEXT.attrDmg) + cell('', 'fa-shield', a.arm, TEXT.attrArm) +
      cell('', 'fa-shoe-prints', a.ms, TEXT.attrMs) + cell('', 'fa-gauge-high', a.aps, TEXT.attrAs) + '</div>';
  }
  const extra = [];
  if (s.dmg) extra.push(TEXT.dmg + ' <b>' + kilo(s.dmg) + '</b>');
  if (s.heal) extra.push(TEXT.heal + ' <b>' + kilo(s.heal) + '</b>');
  if (s.obs || s.sen) extra.push(TEXT.wardsPlaced + ' <b>' + (s.obs || 0) + '/' + (s.sen || 0) + '</b>');
  if (s.stk) extra.push(TEXT.stacks + ' <b>' + s.stk + '</b>');
  if (a && a.xp) extra.push(TEXT.xp + ' <b>' + kilo(a.xp) + '</b>');
  return '<div class="hero' + (r.f ? ' fogrow' : '') + (r.alive === false ? ' deadrow' : '') + '" data-id="' + esc(r.id) + '">' +
    '<div class="top"><span class="portrait"><img src="' + esc(heroImg(r.name)) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span class="lv">' + esc(r.level || '?') + '</span></span>' +
    '<span class="who"><span class="name">' + esc(heroName(r.name)) + '</span>' + (info.pn ? '<span class="pn">' + esc(info.pn) + '</span>' : '') + '</span><span class="state ' + noteCls + '">' + esc(note) + '</span></div>' +
    '<div class="bars"><div class="meter hp"><i style="width:' + pct(r.hp, r.max_hp) + '%"></i><b>' + (r.max_hp ? esc(r.hp + ' / ' + r.max_hp) : '') + '</b></div>' +
    (r.max_mana ? '<div class="meter mp thin"><i style="width:' + pct(r.mana, r.max_mana) + '%"></i></div>' : '') + '</div>' +
    (kpis.length ? '<div class="kpis" style="grid-template-columns:repeat(' + kpis.length + ',1fr)"' + (s.est ? ' title="* ' + esc(TEXT.est) + '"' : '') + '>' + kpis.map(k => '<div><span>' + esc(k[0]) + '</span><b>' + esc(k[1]) + '</b></div>').join('') + '</div>' : '') +
    attrs + (extra.length ? '<div class="extra">' + extra.map(x => '<span>' + x + '</span>').join('') + '</div>' : '') +
    (items.length ? '<div class="slots">' + inv + '</div>' : '') +
    (back ? '<div class="slots">' + back + '</div>' : '') +
    (abilities ? '<div class="slots">' + abilities + '</div>' : '') + '</div>';

function portraitImg(name) {
  return CDN + 'heroes/' + heroKey(name) + '.png';
}
let scoreHtml = '';
function tile(entry) {

  const dead = r.alive === false;
  const kda = typeof s.k === 'number' ? s.k + '/' + s.d + (typeof s.a === 'number' ? '/' + s.a : '') : '';
  const creeps = typeof s.lh === 'number' ? s.lh + '/' + (s.dn || 0) : '';

  }

    '<span class="lv">' + esc(r.level || '') + '</span>' + (creeps ? '<span class="k" title="' + esc(TEXT.lhdn + (kda ? ' · ' + TEXT.kda + ' ' + kda : '')) + '">' + esc(creeps) + '</span>' : '') +
    '<span class="dt">' + (dead && r.respawn_at ? Math.ceil(remaining(r.respawn_at)) : '') + '</span></div>' +
    '<div class="hb"><i style="width:' + (dead ? 0 : pct(r.hp, r.max_hp)) + '%"></i><b>' + (dead || !r.max_hp ? '' : esc(r.hp)) + '</b></div>' +
    '<div class="mb"><i style="width:' + (dead ? 0 : pct(r.mana, r.max_mana)) + '%"></i><b>' + (dead || !r.max_mana ? '' : esc(r.mana)) + '</b></div></div>';
}
function teamTotals(members) {

    if (typeof s.d === 'number') deaths += s.d;
    if (s.est || typeof s.k !== 'number') exact = false;
    if (typeof s.nw === 'number') { nw += s.nw; hasNw = true; partial = partial || !!s.partial; }

}

  const role = team => mine === 2 || mine === 3 ? (team === mine ? TEXT.allies : TEXT.enemies) : '';

  const fill = list => { const out = list.slice(0, 5); while (out.length < 5) out.push(null); return out.map(tile).join(''); };
  const day = clock.day !== false && !clock.ns;
  const next = typeof clock.cyc === 'number' ? clockText(remaining(clock.cyc)) : '';
  const html = '<div class="sb-team r">' + head(2, tr) + '<div class="tiles">' + fill(rad) + '</div></div>' +
    '<div class="sb-mid"><div class="score"><span class="r">' + scoreR + '</span><i>:</i><span class="d">' + scoreD + '</span></div>' +
    '<div class="daybox" title="' + esc(clock.ns ? TEXT.nsNight : (day ? TEXT.day : TEXT.night)) + '"><i class="fa-solid ' + (day ? 'fa-sun day' : 'fa-moon night') + '"></i>' +
    (clock.in_game ? clockText(gameTime()) : '—') + (next ? '<span>' + esc(next) + '</span>' : '') + '</div></div>' +
    '<div class="sb-team d">' + head(3, td) + '<div class="tiles">' + fill(dire) + '</div></div>';
  if (html !== scoreHtml) { scoreHtml = html; $('score').innerHTML = html; }
}
$('score').onclick = ev => {
  const t = ev.target.closest('.tile[data-id]');
  if (!t) return;
  const card = teamsEl.querySelector('.hero[data-id="' + t.dataset.id + '"]');
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 900);
};

function renderSide() {
  renderScore();
  const mine = (live.clock || {}).team;
  const rows = Object.values(roster).sort((a, b) => a.row.team - b.row.team || String(a.row.id).localeCompare(String(b.row.id)));
  const groups = [];
  for (const team of (mine === 3 ? [3, 2] : [2, 3])) {
    if ((mine === 2 || mine === 3) && (teamView === 'allies' && team !== mine || teamView === 'enemies' && team === mine)) continue;
    const members = rows.filter(e => e.row.team === team);
    if (!members.length) continue;
    let kills = 0, nw = 0, partial = false, hasNw = false;
    for (const e of members) {
      const s = (e.info || {}).stats || {};
      if (typeof s.k === 'number') kills += s.k;
      if (typeof s.nw === 'number') { nw += s.nw; hasNw = true; partial = partial || !!s.partial; }
    }
    const role = mine === 2 || mine === 3 ? (team === mine ? TEXT.allies : TEXT.enemies) : '';
    groups.push('<div class="tgroup"><div class="team-h"><span class="flag" style="background:var(--' + (team === 2 ? 'rad' : 'dire') + ')"></span><h2>' +
      esc(team === 2 ? TEXT.radiant : TEXT.dire) + '</h2><span class="role">' + esc(role) + '</span><span class="sum"><span><b>' + kills + '</b> ' + esc(TEXT.kills) + '</span>' +
      (hasNw ? '<span>' + esc(TEXT.nwTotal) + ' <b>' + (partial ? '≥' : '') + kilo(nw) + '</b></span>' : '') + '</span></div>' + members.map(heroCard).join('') + '</div>');
  }
  const html = groups.join('');
  if (html !== sideHtml) { sideHtml = html; teamsEl.innerHTML = html; }
}

function cdText(v) {
  return typeof v === 'number' ? secs(remaining(v)) : '—';
}
function bossState(o) {
  if (!o) return [TEXT.noData, ''];
  if (o.alive === false) return [TEXT.bossDead, 'bad'];
  const hp = typeof o.hp === 'number' ? 'HP ' + o.hp + '%' : TEXT.bossSeen;
  return [hp + (o.under_attack ? ' · ' + TEXT.bossHit : ''), o.under_attack ? 'warn' : 'ok'];
}
function renderObjs() {
  const obj = live.objectives || {};
  const cells = [];
  const rosh = bossState(obj.roshan);
  cells.push(['radar/icons/roshan.png', TEXT.roshan, rosh[0], rosh[1]]);
  const torms = list(obj.tormentors);
  if (!torms.length) cells.push([TORM_ICON('radiant'), TEXT.tormentor, TEXT.noData, '']);
  torms.forEach((t, i) => {
    const st = bossState(t);
    cells.push([TORM_ICON(i === 1 ? 'dire' : 'radiant'), TEXT.tormentor + (torms.length > 1 ? ' ' + (i + 1) : ''), st[0], st[1]]);
  });
  cells.push(['fa-shield-halved', TEXT.glyph, cdText(obj.glyph_radiant) + ' / ' + cdText(obj.glyph_dire), '']);
  cells.push(['fa-satellite-dish', TEXT.scan, cdText(obj.scan_radiant) + ' / ' + cdText(obj.scan_dire), '']);
  const sc = obj.scan_charges || {};
  if (typeof sc.r === 'number' || typeof sc.d === 'number') cells.push(['fa-bolt', TEXT.scanCharges, (sc.r ?? '—') + ' / ' + (sc.d ?? '—'), '']);
  const camps = list(live.camps);
  if (camps.length) cells.push(['radar/icons/' + CAMP_ICON, TEXT.camps, camps.filter(c => c.s === 1).length + ' / ' + camps.length, '']);
  const st = obj.stock || {};
  if (typeof st.smoke === 'number') cells.push([itemImg('item_smoke_of_deceit'), TEXT.stock, 'Smoke ' + st.smoke + ' · Obs ' + (st.obs ?? '—') + ' · Sen ' + (st.sen ?? '—'), '']);
  if (cells.length % 2) cells.push(null);
  objsEl.innerHTML = cells.map(c => c ? '<div class="obj">' + (c[0].indexOf('fa-') === 0 ? '<i class="fa-solid ' + c[0] + '"></i>' : '<img src="' + esc(c[0]) + '" alt="">') +
    '<div style="min-width:0"><div class="k">' + esc(c[1]) + '</div><div class="v ' + c[3] + '">' + esc(c[2]) + '</div></div></div>' : '<div class="obj"></div>').join('');
}

function placeText(code) {
  if (!code) return null;
  return String(code).split(',').map(one => {
    if (TEXT.place[one]) return TEXT.place[one];
    const tower = /^t([rd])(\d)_(\w+)$/.exec(one);
    if (tower) return fmt(TEXT.tower, { team: TEXT.boss[tower[1]], tier: tower[2], lane: TEXT.zone[tower[3]] || tower[3] });
    const parts = one.split('_');
    return TEXT.zone[parts[0]] && TEXT.side[parts[1]] ? TEXT.zone[parts[0]] + ', ' + TEXT.side[parts[1]] : one;
  }).join(', ');
}
function bossName(e) {
  if (e.b === 'rosh') return TEXT.boss.rosh;
  return e.team ? fmt(TEXT.boss.tormSide, { side: TEXT.boss[e.team] }) : TEXT.boss.torm;
}
function feedHtml(e) {
  const f = TEXT.feed;
  const b = v => v == null ? null : '<b>' + esc(v) + '</b>';
  const place = placeText(e.p);
  const values = {
    h: b(e.h ? heroName(e.h) : null), p: place == null ? null : esc(place), r: typeof e.r === 'number' ? Math.round(e.r) : null,
    a: b(typeof e.a === 'number' ? TEXT.runes[e.a] : (e.a ? abilityName(e.a, e.h) : null)),
    team: b(e.team ? TEXT.boss[e.team] : null), b: b(e.b ? bossName(e) : null), w: e.w ? esc(TEXT.ward[e.w]) : null,
    v: typeof e.v === 'number' ? e.v + '%' : '?', n: e.n ? ' (' + list(e.n).map(heroName).map(esc).join(', ') + ')' : '',
  };
  let key = e.k;
  if (key === 'death' && values.r) key = 'deathRespawn';
  if (key === 'rune' && values.p) key = 'runeAt';
  if (key === 'scan_used' && values.p) key = 'scan_usedAt';
  if (key === 'smoke' && !values.h) key = 'smokeAnon';
  if (!f[key]) return esc(e.k || '');
  return fmt(esc(f[key]), values).replace(/ · \?$/, '');
}
function feedClass(e) {
  const k = String(e.k || '');
  if (k.indexOf('boss') === 0) return 'boss';
  if (k === 'rune') return 'rune';
  if (k === 'scan' || k === 'scan_used' || k === 'glyph') return 'scan';
  if (k === 'smoke') return 'smoke';
  return e.s || '';
}
function feedIcon(e) {
  if (typeof e.a === 'string' && (e.k === 'ability' || e.k === 'ult')) return abilityImg(e.a);
  if (e.k === 'smoke') return itemImg('item_smoke_of_deceit');
  if (e.k === 'ward') return 'radar/icons/' + (e.w === 's' ? 'centry_ward.png' : 'Observer_ward.png');
  if (e.k === 'rune' && typeof e.a === 'number' && RUNE_ICONS[e.a]) return 'radar/icons/' + RUNE_ICONS[e.a];
  if (e.k === 'tp_from' || e.k === 'tp_to') return itemImg('item_tpscroll');
  if (e.k === 'blink') return itemImg('item_blink');
  if (e.k === 'tower' || e.k === 'rax') return 'radar/icons/' + TOWER_ICON;
  if (e.b === 'rosh') return 'radar/icons/roshan.png';
  if (e.b === 'torm') return TORM_ICON(e.team === 'd' ? 'dire' : 'radiant');
  if (e.h) return heroImg(e.h);
  return null;
}

function feedLine(key, e) {
  feedData.set(key, e);
  let line = feedLines.get(key);
  if (!line) {
    line = document.createElement('div');
    feedLines.set(key, line);
    let next = null;
    for (const [other, el] of feedLines) if (other > key && (!next || other < next.key)) next = { key: other, el };
    logEl.insertBefore(line, next ? next.el : null);
  }
  line.className = 'ev ' + feedClass(e);
  const src = feedIcon(e);
  line.innerHTML = '<span class="t">' + clockText(e.t) + '</span>' + (src ? '<img src="' + esc(src) + '" alt="" onerror="this.style.visibility=\'hidden\'">' : '<span></span>') +
    '<span class="x">' + feedHtml(e) + '</span>';
}

function applyLive() {
  liveAt = performance.now();
  const clock = live.clock || {};
  clockEl.innerHTML = clock.in_game ? '<i class="fa-solid ' + (clock.day === false || clock.ns ? 'fa-moon' : 'fa-sun') + '" style="color:' + (clock.day === false || clock.ns ? '#8fa8ff' : '#f5c542') + '"></i>' + esc(clockText(clock.t) + (clock.paused ? ' · ' + TEXT.paused : '')) : '';
  if (!clock.in_game) { roster = {}; heroes = {}; }
  const info = live.info || {};
  const next = {};
  const nextRoster = {};
  for (const row of list(live.pos)) {
    if (typeof row.x !== 'number' || typeof row.y !== 'number') continue;
    const key = String(row.id);
    const old = heroes[key];
    const jump = !old || old.row.f !== row.f || Math.hypot(old.cx - row.x, old.cy - row.y) > 2500;
    next[key] = { row: row, cx: jump ? row.x : old.cx, cy: jump ? row.y : old.cy };
    const prev = roster[key];
    nextRoster[key] = { row: row, info: info['h' + key] || (prev && prev.info) };
  }
  heroes = next;
  roster = nextRoster;
  renderObjs();
  renderSide();
}

function refreshStatus() {
  let text, cls = 'bad';
  if (!sessionId) text = TEXT.badLink;
  else if (!connected) text = TEXT.offline;
  else if (!meta) text = metaSeen ? TEXT.closed : TEXT.missing;
  else {
    const age = (Date.now() + serverOffset - (meta.updated || 0)) / 1000;
    stale = age > 3;
    const inGame = live.clock && live.clock.in_game;
    text = stale ? TEXT.stale : (inGame ? TEXT.online : TEXT.waiting);
    cls = stale || !inGame ? 'warn' : 'ok';
  }
  if (!meta) stale = true;
  $('statusText').textContent = text;
  statusEl.className = 'chip ' + cls;
  $('empty').classList.toggle('on', !(live.clock && live.clock.in_game));
  $('emptyText').textContent = cls === 'ok' ? TEXT.waiting : text;
}

applyText();

if (/^[A-Za-z0-9]{20}$/.test(sessionId)) {
  $('statusText').textContent = TEXT.connecting;
  const db = getDatabase(initializeApp(firebaseConfig));
  const base = 'sessions/' + sessionId;
  onValue(ref(db, '.info/connected'), snap => { connected = snap.val() === true; refreshStatus(); });
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  onValue(ref(db, base + '/meta'), snap => {
    meta = snap.val();
    if (meta) metaSeen = true;
    if (!meta) { live = {}; applyLive(); }
    refreshStatus();
  }, () => { meta = null; refreshStatus(); });
  onValue(ref(db, base + '/live'), snap => { live = snap.val() || {}; applyLive(); refreshStatus(); }, () => {});
  const feed = query(ref(db, base + '/feed'), limitToLast(100));
  const atBottom = () => logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  onChildAdded(feed, snap => { const stick = atBottom(); feedLine(snap.key, snap.val() || {}); if (stick) logEl.scrollTop = logEl.scrollHeight; });
  onChildChanged(feed, snap => feedLine(snap.key, snap.val() || {}));
  onChildRemoved(feed, snap => { const line = feedLines.get(snap.key); if (line) line.remove(); feedLines.delete(snap.key); feedData.delete(snap.key); });
} else {
  connected = true;
}
refreshStatus();
setInterval(function () { refreshStatus(); renderSide(); renderObjs(); }, 1000);

try {
  const wurl = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' }));
  new Worker(wurl).onmessage = frame;
} catch (e) {
  setInterval(frame, 33);
}
window.addEventListener('hashchange', () => location.reload());

const popBtn = $('popcon');
if (!window.documentPictureInPicture) popBtn.style.display = 'none';
popBtn.onclick = async function () {
  try {
    if (consoleEl.ownerDocument !== document) {
      window.documentPictureInPicture.window.close();
      return;
    }
    const w = await window.documentPictureInPicture.requestWindow({ width: 420, height: 420 });
    for (const st of document.querySelectorAll('style, link[rel="stylesheet"]')) w.document.head.appendChild(st.cloneNode(true));
    w.document.documentElement.className = document.documentElement.className;
    w.document.body.style.cssText = 'margin:0;height:100vh;background:var(--bg);display:flex';
    const parent = consoleEl.parentNode, after = consoleEl.nextSibling;
    consoleEl.classList.add('pop');
    w.document.body.appendChild(consoleEl);
    w.addEventListener('pagehide', function () {
      consoleEl.classList.remove('pop');
      parent.insertBefore(consoleEl, after);
    });
  } catch (e) {
    $('statusText').textContent = TEXT.noWindow + e.message;
  }
};

let pipVideo = null;
openPip = async function () {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    if (!pipVideo) {
      pipVideo = document.createElement('video');
      pipVideo.muted = true;
      pipVideo.playsInline = true;
      pipVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(pipVideo);
      pipVideo.srcObject = canvas.captureStream(30);
    }
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
  } catch (e) {
    $('statusText').textContent = TEXT.noWindow + e.message;
  }
};
</script>
</body>
</html>
