<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cloud Radar</title>
<style>
:root { --bg:#0b0e13; --panel:#141921; --panel2:#1b212b; --line:#262e3a; --text:#e6edf3; --dim:#8b949e; --rad:#4ade80; --dire:#f87171; --gold:#fbbf24; --blue:#60a5fa; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
#app { display:flex; height:100%; }
#stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; position:relative; }
#side { width:360px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:10px 12px; }
.pill { position:absolute; padding:4px 10px; border-radius:999px; background:rgba(20,25,33,.92); border:1px solid var(--line); font-size:12px; }
#status { top:12px; left:12px; color:var(--dim); }
#status.ok { color:var(--rad); }
#clock { top:12px; right:12px; font-variant-numeric:tabular-nums; font-weight:600; }
#clock:empty { display:none; }
#layers { position:absolute; top:44px; left:12px; display:flex; flex-direction:column; gap:4px; }
#layers button { text-align:left; padding:3px 9px; border-radius:6px; background:rgba(20,25,33,.92); border:1px solid var(--line); color:var(--dim); font:inherit; font-size:12px; cursor:pointer; }
#layers button.on { color:var(--text); border-color:#3b4656; }
#layers button.on::before { content:'●'; color:var(--rad); margin-right:6px; font-size:9px; vertical-align:1px; }
#layers button:not(.on)::before { content:'○'; margin-right:6px; font-size:9px; vertical-align:1px; }
#tools { position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
#tools button { padding:6px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:var(--text); font:inherit; cursor:pointer; }
#tools button:hover { border-color:var(--dim); }
#marks { position:absolute; pointer-events:none; overflow:hidden; border-radius:10px; }
#marks img { position:absolute; border-radius:50%; box-shadow:0 0 0 2px var(--c), 0 0 6px rgba(0,0,0,.8); transform:translate(-50%,-50%); }
#legend { position:absolute; left:12px; bottom:12px; color:var(--dim); font-size:11px; background:rgba(20,25,33,.85); border:1px solid var(--line); border-radius:8px; padding:6px 9px; display:grid; gap:2px; }
#legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
h3 { margin:6px 0 6px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); font-weight:600; }
#console { border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:6px; background:var(--panel); }
#console.pop { height:100vh; display:flex; flex-direction:column; margin:0; padding:8px; }
#console.pop #log { flex:1; height:auto; }
#objs { font-size:12px; padding:2px 0 8px; display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; }
#objs .o { display:flex; justify-content:space-between; gap:6px; }
#objs .o span:first-child { color:var(--dim); }
#log { height:260px; overflow:auto; font:12px/1.55 system-ui, sans-serif; }
#log > div { display:flex; gap:6px; align-items:flex-start; padding:1px 0; }
#log .t { color:var(--dim); font:11px/1.7 ui-monospace, Consolas, monospace; flex:none; width:38px; }
#log img { width:18px; height:18px; border-radius:3px; flex:none; margin-top:1px; }
#log .a { color:#a7f3c0; } #log .e { color:#fca5a5; } #log .boss { color:var(--gold); } #log .rune { color:#d8b4fe; } #log .scan { color:#93c5fd; } #log .smoke { color:#cbd5e1; }
.team { margin-top:4px; }
.row { padding:8px 0; border-bottom:1px solid var(--line); }
.row .top { display:flex; align-items:center; gap:8px; }
.row .top > img { width:40px; height:23px; border-radius:3px; flex:none; object-fit:cover; }
.row .name { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .lvl { font-size:11px; padding:1px 6px; border-radius:4px; background:var(--panel2); color:var(--text); }
.row .note { font-size:11px; color:var(--dim); margin-top:2px; }
.row .note.fogged { color:#fcd34d; }
.row .note.dead { color:var(--dire); }
.row .note.tp { color:var(--blue); }
.bars { display:grid; gap:2px; margin-top:4px; }
.bar { position:relative; height:9px; border-radius:2px; background:#222a35; overflow:hidden; }
.bar > i { display:block; height:100%; }
.bar > b { position:absolute; inset:0; font:600 8px/9px system-ui; text-align:center; color:#fff; text-shadow:0 0 2px #000; }
.hp > i { background:linear-gradient(#4ade80,#22a35a); }
.mp > i { background:linear-gradient(#60a5fa,#2f6fd0); }
.stats { font-size:11px; color:var(--dim); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
.stats b { color:var(--text); font-weight:600; }
.stats > span { white-space:nowrap; }
.slots { display:flex; gap:3px; margin-top:5px; flex-wrap:wrap; align-items:center; }
.slot { position:relative; width:33px; height:24px; border-radius:3px; background:#0f141b; border:1px solid var(--line); overflow:hidden; flex:none; }
.slot img { width:100%; height:100%; object-fit:cover; display:block; }
.slot.small { width:25px; height:18px; opacity:.6; }
.slot.neutral { border-radius:50%; width:24px; height:24px; }
.slot.old img { filter:grayscale(.7) brightness(.7); }
.slot em { display:none; position:absolute; inset:0; font:600 7px/1.1 system-ui; color:var(--dim); padding:1px; overflow:hidden; font-style:normal; }
.slot.noimg em { display:block; }
.slot .cd { position:absolute; inset:0; background:rgba(0,0,0,.62); color:#fff; font:700 10px/24px system-ui; text-align:center; }
.slot.small .cd { line-height:18px; font-size:9px; }
.slot .ch { position:absolute; right:1px; bottom:0; font:700 8px/1 system-ui; color:#fff; text-shadow:0 0 2px #000; }
.slot.ab { width:26px; height:26px; }
.slot.ab .cd { line-height:26px; }
.slot.ab.l0 img { filter:grayscale(1) brightness(.45); }
.slot .pips { position:absolute; left:1px; right:1px; bottom:1px; display:flex; gap:1px; }
.slot .pips i { flex:1; height:2px; background:var(--gold); border-radius:1px; }
.sep { width:6px; }
.team-2 .name { color:var(--rad); }
.team-3 .name { color:var(--dire); }
.row.fog { opacity:.78; }
.row.deadrow { opacity:.55; }
@media (max-width:760px) { #app { flex-direction:column; } #side { width:100%; height:42%; border-left:0; border-top:1px solid var(--line); } #legend { display:none; } }
</style>

function fmt(text, values) {
  return text.replace(/\{(\w+)\}/g, (_, key) => values[key] == null ? '?' : values[key]);
}
function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function heroKey(name) {

  return words(String(name || '').replace(/^item_/, '').replace(/^recipe_/, 'recipe_'));

function abilityName(name, hero) {

function drawVision() {

function drawCamps() {

function drawUnits() {
  const u = unit();
  const all = list(live.units);
  for (const row of all) {
    if (typeof row.x !== 'number') continue;
    const [x, y] = toScreen(row.x, row.y);
    const kind = row.kind;
    if (kind === 'building') {
      if (!layers.buildings) continue;
      ctx.globalAlpha = row.f ? 0.55 : 1;
      circle(x, y, 7 * u);
      ctx.fillStyle = teamColor(row.team, 0.9);
      ctx.fill();
      drawIcon(TOWER_ICON, x, y, 11 * u);
      if (typeof row.hp === 'number' && row.hp < 100) {
        ctx.beginPath();
        ctx.arc(x, y, 9.5 * u, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * row.hp / 100);
        ctx.strokeStyle = row.hp > 50 ? '#bbf7d0' : (row.hp > 25 ? '#fde68a' : '#fecaca');
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    } else if (kind === 'creep') {
      if (!layers.creeps) continue;
      const r = (row.s ? 3.6 : 2.6) * u;
      if (row.f === 2) {
        ctx.globalAlpha = 0.85;
        circle(x, y, r);
        ctx.strokeStyle = teamColor(row.team);
        ctx.lineWidth = 1.4;
        ctx.stroke();
      } else {
        ctx.globalAlpha = 1;
        if (row.s) { ctx.fillStyle = teamColor(row.team); ctx.fillRect(x - r, y - r, r * 2, r * 2); }
        else { circle(x, y, r); ctx.fillStyle = teamColor(row.team); ctx.fill(); }
        ctx.strokeStyle = 'rgba(0,0,0,.6)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    } else if (kind === 'neutral') {
      if (!layers.jungle) continue;
      ctx.globalAlpha = row.f ? 0.35 : 0.95;
      circle(x, y, 2.3 * u);
      ctx.fillStyle = '#e2b84a';
      ctx.fill();
    } else if (kind === 'courier') {
      if (!layers.heroes) continue;
      ctx.globalAlpha = row.f ? 0.45 : 1;
      ctx.beginPath();
      ctx.moveTo(x, y - 5 * u); ctx.lineTo(x + 4 * u, y); ctx.lineTo(x, y + 5 * u); ctx.lineTo(x - 4 * u, y); ctx.closePath();
      ctx.fillStyle = teamColor(row.team);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.7)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (kind === 'roshan') {
      ctx.globalAlpha = 1;
      drawIcon('roshan.png', x, y, 22 * u);
    } else if (kind === 'tormentor') {
      ctx.globalAlpha = row.f ? 0.6 : 1;
      drawIcon('dota_minimap_assets/tormentor/tormentor_timer_icon_' + (row.x + row.y < 0 ? 'radiant' : 'dire') + '_png.png', x, y, 20 * u);

      drawIcon('Wisdom.png', x, y, 18 * u);

}

function drawWards() {

    const [x, y] = toScreen(w.x, w.y);

function drawRunes() {
  const u = unit();

function drawEvents() {
  if (!layers.events) return;
  const u = unit();
  const t = gameTime();
  const pulse = (performance.now() % 1200) / 1200;
  for (const e of list(live.events)) {
    const [x, y] = toScreen(e.x, e.y);
    const age = typeof e.t0 === 'number' ? Math.max(0, t - e.t0) : 0;
    const color = e.team === 2 || e.team === 3 ? teamColor(e.team) : '#fb923c';
    if (e.kind === 'teleport') {
      if (e.ph === 'destination' && typeof e.ox === 'number') {
        const [ox, oy] = toScreen(e.ox, e.oy);
        ctx.setLineDash([6, 5]);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(x, y); ctx.stroke();
        ctx.setLineDash([]);
      }
      circle(x, y, (10 + 6 * pulse) * u);
      ctx.strokeStyle = 'rgba(96,165,250,' + (1 - pulse) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      circle(x, y, 7 * u);
      ctx.strokeStyle = color;
      ctx.stroke();
      if (e.ph === 'destination' && typeof e.te === 'number') label('TP ' + Math.ceil(remaining(e.te)), x, y - 15 * u, '#bfdbfe', 10);
      continue;
    }
    if (e.kind === 'scan') {
      circle(x, y, world(900));
      ctx.fillStyle = 'rgba(96,165,250,.10)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(96,165,250,' + (0.9 - pulse * 0.6) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();
      continue;
    }
    if (e.kind === 'smoke') {
      circle(x, y, 18 * u);
      ctx.fillStyle = 'rgba(148,163,184,.35)';
      ctx.fill();
      label('SMOKE', x, y, '#e2e8f0', 9);
      continue;
    }
    if (e.kind === 'innate') continue;
    const alpha = Math.max(0.35, 1 - age / 6) * (e.f ? 0.7 : 1);
    ctx.globalAlpha = alpha;
    circle(x, y, (6 + 4 * Math.min(1, age)) * u);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    circle(x, y, 2.5 * u);
    ctx.fillStyle = color;
    ctx.fill();
    if (e.a && !document.pictureInPictureElement) marks.push({ src: abilityImg(e.a), x: x, y: y - 16 * u, s: 20 * u, c: color, o: alpha, t: abilityName(e.a, e.h) });

    ctx.globalAlpha = 1;
  }
}

function drawHero(h, t) {
  const r = h.row;
  if (r.alive === false) return;
  if (r.f && !layers.fog) return;
  if (!r.f && !layers.heroes) return;
  const u = unit();
  const [x, y] = toScreen(h.cx, h.cy);
  const age = r.f && typeof r.seen === 'number' ? Math.max(0, t - r.seen) : 0;
  const alpha = r.f === 2 ? 0.4 : (r.f === 1 ? Math.max(0.45, 1 - age / 60) : 1);
  const s = 22 * u;
  ctx.globalAlpha = alpha;
  circle(x, y, s / 2 + 2.5);
  ctx.fillStyle = 'rgba(0,0,0,.7)';
  ctx.fill();
  if (!drawIcon(heroImg(r.name), x, y, s, true)) {
    circle(x, y, s / 2);
    ctx.fillStyle = teamColor(r.team);
    ctx.fill();
  }
  circle(x, y, s / 2 + 1.5);
  ctx.lineWidth = r.me ? 3 : 2;
  ctx.strokeStyle = r.me ? '#ffffff' : teamColor(r.team);
  if (r.f) { ctx.setLineDash([4, 3]); ctx.strokeStyle = r.f === 1 ? '#fcd34d' : '#94a3b8'; }
  ctx.stroke();
  ctx.setLineDash([]);
  if (!r.f && r.max_hp > 0 && r.hp >= 0) {
    const w = s + 4;
    ctx.fillStyle = 'rgba(0,0,0,.75)';
    ctx.fillRect(x - w / 2, y + s / 2 + 3, w, 4);
    ctx.fillStyle = r.hp / r.max_hp > 0.5 ? '#4ade80' : (r.hp / r.max_hp > 0.25 ? '#facc15' : '#f87171');
    ctx.fillRect(x - w / 2, y + s / 2 + 3, w * Math.max(0, Math.min(1, r.hp / r.max_hp)), 4);
    if (r.max_mana > 0) {
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(x - w / 2, y + s / 2 + 7, w * Math.max(0, Math.min(1, r.mana / r.max_mana)), 2);
    }

  ctx.globalAlpha = 1;
  if (r.f) label(Math.round(age) + 's', x + s / 2 + 4, y - s / 2, r.f === 1 ? '#fde68a' : '#cbd5e1', 9);
  if (typeof r.tp === 'number' && remaining(r.tp) > 0) {
    ctx.beginPath();
    ctx.arc(x, y, s / 2 + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ((performance.now() / 700) % 1));
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

const marksEl = $('marks');
const markPool = [];
let marks = [];
function syncMarks() {
  marksEl.style.left = canvas.offsetLeft + 'px';
  marksEl.style.top = canvas.offsetTop + 'px';
  marksEl.style.width = size + 'px';
  marksEl.style.height = size + 'px';
  marks.forEach((m, i) => {
    let im = markPool[i];
    if (!im) { im = markPool[i] = document.createElement('img'); im.alt = ''; im.onerror = () => { im.style.visibility = 'hidden'; }; marksEl.appendChild(im); }
    if (im.dataset.src !== m.src) { im.dataset.src = m.src; im.style.visibility = ''; im.src = m.src; }
    im.style.display = '';

let lastFrame = performance.now();
function frame() {
  marks = [];
  const nowMs = performance.now();
  const k = 1 - Math.exp(-Math.min(0.1, (nowMs - lastFrame) / 1000) * 12);
  lastFrame = nowMs;
  drawMap();
  drawVision();
  drawCamps();
  drawUnits();
  drawWards();
  drawRunes();
  drawEvents();
  const t = gameTime();
  const ids = Object.keys(heroes).sort((a, b) => (heroes[b].row.f || 0) - (heroes[a].row.f || 0));
  for (const id of ids) {
    const h = heroes[id];
    h.cx += (h.row.x - h.cx) * k;
    h.cy += (h.row.y - h.cy) * k;
    drawHero(h, t);
  }
  syncMarks();
}

function pct(a, b) {

}

function slot(src, title, opts) {

  const ch = opts.charges ? '<span class="ch">' + esc(opts.charges) + '</span>' : '';
  const pips = opts.level ? '<span class="pips">' + '<i></i>'.repeat(Math.min(opts.level, 7)) + '</span>' : '';
  return '<span class="slot ' + (opts.cls || '') + '" title="' + esc(title) + '"><img src="' + esc(src) + '" alt="" loading="lazy" onerror="this.parentNode.classList.add(\'noimg\');this.remove()"><em>' + esc(title) + '</em>' + cd + ch + pips + '</span>';
}

function heroCard(entry) {

  if (r.alive === false) { note = r.respawn_at ? fmt(TEXT.deadIn, { n: Math.ceil(remaining(r.respawn_at)) }) : TEXT.dead; noteCls = 'dead'; }
  else if (typeof r.tp === 'number' && remaining(r.tp) > 0) { note = fmt(TEXT.tp, { n: Math.ceil(remaining(r.tp)) }); noteCls = 'tp'; }
  else if (r.f) { note = fmt(r.f === 1 ? TEXT.maphack : TEXT.lastSeen, { n: Math.round(Math.max(0, t - (r.seen || t))) }); noteCls = 'fogged'; }
  else note = TEXT.visible;
  const s = info.stats || {};

  if (typeof s.k === 'number') stats.push('<b>' + s.k + '/' + s.d + '/' + s.a + '</b>');
  if (typeof s.nw === 'number') stats.push(TEXT.nw + ' <b>' + (s.partial ? '≥' : '') + (Math.round(s.nw / 100) / 10) + 'k</b>');
  if (typeof s.lh === 'number') stats.push(TEXT.lhdn + ' <b>' + s.lh + '/' + (s.dn || 0) + '</b>');

  let back = '';

  if (bySlot[15]) back += '<span class="sep"></span>' + slot(itemImg(bySlot[15].name), itemName(bySlot[15].name), { cd: remaining(bySlot[15].ready_at), cls: 'small' });
  const abilities = list(info.abilities).map(a => slot(abilityImg(a.name), abilityName(a.name, r.name) + (a.level ? ' (' + a.level + ')' : ''),
    { cd: remaining(a.ready_at), level: a.level, charges: a.charges, cls: 'ab' + (a.level ? '' : ' l0') })).join('');
  return '<div class="row team-' + esc(r.team) + (r.f ? ' fog' : '') + (r.alive === false ? ' deadrow' : '') + '">' +
    '<div class="top"><img src="' + esc(heroImg(r.name)) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span class="name">' + esc(heroName(r.name)) + '</span><span class="lvl">' + esc(r.level || '?') + '</span></div>' +
    '<div class="note ' + noteCls + '">' + esc(note) + '</div>' +
    '<div class="bars"><div class="bar hp"><i style="width:' + pct(r.hp, r.max_hp) + '%"></i><b>' + (r.max_hp ? esc(r.hp + ' / ' + r.max_hp) : '') + '</b></div>' +
    (r.max_mana ? '<div class="bar mp"><i style="width:' + pct(r.mana, r.max_mana) + '%"></i><b>' + esc(r.mana + ' / ' + r.max_mana) + '</b></div>' : '') + '</div>' +
    (stats.length ? '<div class="stats">' + stats.map(x => '<span>' + x + '</span>').join('') + '</div>' : '') +
    (items.length ? '<div class="slots">' + inv + '</div>' : '') +

}

let sideHtml = '';
function renderSide() {
  const mine = (live.clock || {}).team;

  const groups = [];
  for (const team of (mine === 3 ? [3, 2] : [2, 3])) {
    const members = rows.filter(e => e.row.team === team);
    if (!members.length) continue;

    groups.push('<h3 class="team">' + esc(title) + '</h3>' + members.map(heroCard).join(''));

function cdText(v) {

}

function placeText(code) {

function feedIcon(e) {

const feedLines = new Map();
function feedLine(key, e) {

    feedLines.set(key, line);
    let next = null;
    for (const [other, el] of feedLines) if (other > key && (!next || other < next.key)) next = { key: other, el };
    logEl.insertBefore(line, next ? next.el : null);
  }
  line.className = feedClass(e);
  line.textContent = '';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = clockText(e.t);
  line.appendChild(t);
  const src = feedIcon(e);
  if (src) {
    const im = document.createElement('img');
    im.src = src;
    im.alt = '';
    im.onerror = () => im.remove();
    line.appendChild(im);
  }
  const text = document.createElement('span');
  text.textContent = feedText(e);
  line.appendChild(text);
}

function applyLive() {
  liveAt = performance.now();
  const clock = live.clock || {};
  clockEl.textContent = clock.in_game ? clockText(clock.t) + (clock.paused ? ' · ' + TEXT.paused : '') : '';
  if (!clock.in_game) { roster = {}; heroes = {}; }
  const info = live.info || {};
  const next = {};
  const nextRoster = {};
  for (const row of list(live.pos)) {
    if (typeof row.x !== 'number' || typeof row.y !== 'number') continue;
    const key = String(row.id);
    const old = heroes[key];
    const jump = !old || old.row.f !== row.f || Math.hypot(old.cx - row.x, old.cy - row.y) > 2500;
    next[key] = { row: row, cx: jump ? row.x : old.cx, cy: jump ? row.y : old.cy };
    const prev = roster[key];
    nextRoster[key] = { row: row, info: info['h' + key] || (prev && prev.info) };
  }
  heroes = next;
  roster = nextRoster;
  renderObjs();
  renderSide();
}

function refreshStatus() {
  let text;
  if (!sessionId) text = TEXT.badLink;
  else if (!connected) text = TEXT.offline;
  else if (!meta) text = metaSeen ? TEXT.closed : TEXT.missing;
  else {
    const age = (Date.now() + serverOffset - (meta.updated || 0)) / 1000;
    stale = age > 3;
    text = stale ? TEXT.stale : ((live.clock && live.clock.in_game) ? TEXT.online : TEXT.waiting);
  }
  if (!meta) stale = true;
  statusEl.textContent = text;
  statusEl.className = 'pill' + (meta && !stale ? ' ok' : '');
}

if (/^[A-Za-z0-9]{20}$/.test(sessionId)) {
  const db = getDatabase(initializeApp(firebaseConfig));
  const base = 'sessions/' + sessionId;
  onValue(ref(db, '.info/connected'), snap => { connected = snap.val() === true; refreshStatus(); });
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  onValue(ref(db, base + '/meta'), snap => {
    meta = snap.val();
    if (meta) metaSeen = true;
    if (!meta) { live = {}; applyLive(); }
    refreshStatus();
  }, () => { meta = null; refreshStatus(); });
  onValue(ref(db, base + '/live'), snap => { live = snap.val() || {}; applyLive(); refreshStatus(); }, () => {});
  const feed = query(ref(db, base + '/feed'), limitToLast(100));
  const atBottom = () => logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  onChildAdded(feed, snap => { const stick = atBottom(); feedLine(snap.key, snap.val() || {}); if (stick) logEl.scrollTop = logEl.scrollHeight; });
  onChildChanged(feed, snap => feedLine(snap.key, snap.val() || {}));
  onChildRemoved(feed, snap => { const line = feedLines.get(snap.key); if (line) line.remove(); feedLines.delete(snap.key); });
} else {
  connected = true;
}
refreshStatus();
setInterval(function () { refreshStatus(); renderSide(); renderObjs(); }, 1000);

try {
  const wurl = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' }));
  new Worker(wurl).onmessage = frame;
} catch (e) {
  setInterval(frame, 33);
}
window.addEventListener('hashchange', () => location.reload());

const popBtn = $('popcon');
if (!window.documentPictureInPicture) popBtn.style.display = 'none';
popBtn.onclick = async function () {
  try {
    if (consoleEl.ownerDocument !== document) {
      window.documentPictureInPicture.window.close();
      return;
    }
    const w = await window.documentPictureInPicture.requestWindow({ width: 400, height: 380 });
    for (const st of document.querySelectorAll('style')) w.document.head.appendChild(st.cloneNode(true));
    consoleEl.classList.add('pop');
    w.document.body.appendChild(consoleEl);
    w.addEventListener('pagehide', function () {
      consoleEl.classList.remove('pop');
      side.insertBefore(consoleEl, side.firstChild);
    });
  } catch (e) {
    statusEl.textContent = TEXT.noWindow + e.message;
  }
};

const pipBtn = $('pip');
let pipVideo = null;
if (!document.pictureInPictureEnabled || !canvas.captureStream) pipBtn.style.display = 'none';
pipBtn.onclick = async function () {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    if (!pipVideo) {
      pipVideo = document.createElement('video');
      pipVideo.muted = true;
      pipVideo.playsInline = true;
      pipVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(pipVideo);
      pipVideo.srcObject = canvas.captureStream(30);
    }
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
  } catch (e) {
    statusEl.textContent = TEXT.noWindow + e.message;
  }
};
</script>
</body>
</html>
