<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cloud Radar</title>
<style>
:root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --dim:#8b949e; --rad:#4ade80; --dire:#f87171; }
* { box-sizing:border-box; }

html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
#app { display:flex; height:100%; }
#stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; position:relative; }
#side { width:300px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:12px; }
#status, #clock { position:absolute; top:12px; padding:4px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--dim); font-size:12px; }
#status { left:12px; }
#clock { right:12px; color:var(--text); font-variant-numeric:tabular-nums; }
#clock:empty { display:none; }
#pip, #popcon { position:absolute; right:12px; padding:6px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); color:var(--text); font:inherit; cursor:pointer; }
#pip { bottom:12px; }
#popcon { bottom:48px; }
#pip:hover, #popcon:hover { border-color:var(--dim); }
#console { border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; background:var(--panel); }
#console.pop { height:100vh; display:flex; flex-direction:column; margin:0; padding:8px; }
#console.pop #log { flex:1; height:auto; }
#objs { font-size:12px; padding:2px 0 8px; display:grid; gap:3px; }
#objs .o { display:flex; justify-content:space-between; gap:8px; }
#objs .o span:first-child { color:var(--dim); }
#log { height:240px; overflow:auto; font:12px/1.5 ui-monospace, Consolas, monospace; }
#log .t { color:var(--dim); margin-right:6px; }
#log .a { color:var(--rad); }
#log .e { color:var(--dire); }
#log .boss { color:#fbbf24; }
#log .rune { color:#c084fc; }
#log .scan { color:#60a5fa; }
.row { padding:8px 0; border-bottom:1px solid var(--line); }
.row .top { display:flex; align-items:center; gap:8px; }
.row .top img { width:24px; height:24px; border-radius:4px; flex:none; }
.row .name { font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .meta { color:var(--dim); font-size:12px; }
.row .items { color:var(--dim); font-size:11px; margin-top:3px; }
.row .items b { color:var(--text); font-weight:500; }
.bar { height:5px; border-radius:3px; background:#222a35; margin-top:5px; overflow:hidden; }
.bar > i { display:block; height:100%; }
.hp > i { background:#4ade80; }
.mp > i { background:#60a5fa; }
.team-2 .name { color:var(--rad); }
.team-3 .name { color:var(--dire); }
.fog { opacity:.55; }
@media (max-width:700px) { #app { flex-direction:column; } #side { width:100%; height:38%; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>

    popcon: 'Консоль поверх игры', noWindow: 'Окно не открылось: ', dead: 'мертв', visible: 'виден',
    fog: 'в тумане, {n} с назад', lvl: 'ур.', buyback: 'байбек', ult: 'ульт', ready: 'готов', sec: '{n} с',
    roshan: 'Рошан', tormentor: 'Торментор', noData: 'нет данных', bossDead: 'мертв', bossSeen: 'виден', bossHit: 'бьют',
    glyph: 'Глиф Radiant / Dire', scan: 'Скан Radiant / Dire',

    place: { rosh: 'у Рошана', torm: 'у Торментора', base_r: 'база Radiant', base_d: 'база Dire' },
    runes: ['двойной урон', 'скорость', 'иллюзии', 'невидимость', 'регенерация', 'баунти', 'аркейн', 'вода', 'мудрость', 'щит'],
    boss: { rosh: 'Рошан', torm: 'Торментор', tormSide: 'Торментор ({side})', r: 'Radiant', d: 'Dire' },
    feed: {
      death: '{h} погиб', deathRespawn: '{h} погиб (возрождение {r} с)', rune: '{h} взял руну: {a}', runeAt: '{h} взял руну: {a} ({p})',
      tp_from: '{h}: начал телепорт из: {p}', tp_to: '{h}: телепорт, цель: {p}', scan: 'Скан: {p}',
      scan_used: '{team}: использован скан', scan_usedAt: '{team}: использован скан, {p}', glyph: '{team}: использован глиф',
      blink: '{h}: блинк ({p})', ult: '{h}: {a} ({p})', ability: '{h}: {a} ({p})',
      boss_dead: '{b} убит', boss_up: '{b} возродился', boss_hit: '{b}: начали бить, HP {v}{n}', boss_hp: '{b}: HP {v}{n}',
      boss_calm: '{b}: перестали бить, HP {v}',
    },
  },
}[LANG];

function fmt(text, values) {
  return text.replace(/\{(\w+)\}/g, (_, key) => values[key] == null ? '?' : values[key]);
}

const sessionId = location.hash.replace(/^#\/?/, '');
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const side = document.getElementById('side');
const consoleEl = document.getElementById('console');
const objsEl = document.getElementById('objs');
const logEl = document.getElementById('log');
const heroesEl = document.getElementById('heroes');
const statusEl = document.getElementById('status');
const clockEl = document.getElementById('clock');
document.getElementById('pip').textContent = TEXT.pip;
document.getElementById('popcon').textContent = TEXT.popcon;
statusEl.textContent = TEXT.connecting;

let size = 600;
let heroes = {};
let order = [];
let roster = {};
let live = {};
let meta = null;
let metaSeen = false;
let connected = false;
let serverOffset = 0;
let stale = true;
let bgCache = null;
let dotaImg = null;
{
  const im = new Image();
  im.onload = function () { dotaImg = im; bgCache = null; };
  im.src = 'radar/map/dota.jpg';
}
const view = { cx: 0, cy: 0, half: 8000 };

const ICONS = {};
function icon(path) {
  let entry = ICONS[path];
  if (!entry) {
    entry = ICONS[path] = { img: new Image(), ok: false };
    entry.img.onload = function () { entry.ok = true; };
    entry.img.src = 'radar/icons/' + path;
  }
  return entry.ok ? entry.img : null;
}
function heroIcon(name) {
  return 'hero/' + String(name || '').replace('npc_dota_hero_', '') + '.png';
}
const RUNE_ICONS = { 0: 'rune_strong.png', 1: 'rune_speed.png', 2: 'rune_ilusion.png', 3: 'rune_invisible.png', 4: 'rune_regeniration.png',
  5: 'rune_bounty.png', 6: 'rune_magic.png', 7: 'rune_water.png', 8: 'Wisdom.png', 9: 'rune_shield.png' };
const TOWER_ICON = 'dota_minimap_assets/towers/minimap_tower90_psd_a98bbc61.png';

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

function resize() {
  const s = Math.max(200, Math.min(stage.clientWidth, stage.clientHeight) - 24);
  const dpr = window.devicePixelRatio || 1;
  size = s;
  canvas.style.width = s + 'px';
  canvas.style.height = s + 'px';
  canvas.width = Math.round(s * dpr);
  canvas.height = Math.round(s * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgCache = null;
}
window.addEventListener('resize', resize);
resize();

function toScreen(x, y) {
  const k = size / (2 * view.half);
  return [(x - (view.cx - view.half)) * k, ((view.cy + view.half) - y) * k];
}

function pretty(unit) {
  return String(unit || '').replace('npc_dota_hero_', '').replace(/^item_/, '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function rng(seed) {
  let a = seed;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

const LANES = [
  [[0.10, 0.90], [0.07, 0.62], [0.07, 0.07], [0.38, 0.07], [0.90, 0.10]],
  [[0.12, 0.88], [0.50, 0.50], [0.88, 0.12]],
  [[0.10, 0.90], [0.38, 0.93], [0.93, 0.93], [0.93, 0.38], [0.90, 0.10]],
];

function riverV(u) {
  return u + 0.035 * Math.sin(u * 9);
}

function nearAny(u, v, polys, limit) {
  for (const poly of polys) {
    for (let i = 0; i < poly.length - 1; i++) {
      if (segDist(u, v, poly[i][0], poly[i][1], poly[i + 1][0], poly[i + 1][1]) < limit) return true;
    }
  }
  return false;
}

function paintDota(g, s) {
  const base = g.createLinearGradient(0, s, s, 0);
  base.addColorStop(0, '#4d8a3a');
  base.addColorStop(0.5, '#3b6b2f');
  base.addColorStop(1, '#4b5127');
  g.fillStyle = base;
  g.fillRect(0, 0, s, s);

  const dark = g.createRadialGradient(s * 0.5, s * 0.5, s * 0.3, s * 0.5, s * 0.5, s * 0.75);
  dark.addColorStop(0, 'rgba(0,0,0,0)');
  dark.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = dark;
  g.fillRect(0, 0, s, s);

  const rand = rng(11);
  for (let i = 0; i < 2600; i++) {
    const u = 0.03 + rand() * 0.94, v = 0.03 + rand() * 0.94;
    if (nearAny(u, v, LANES, 0.055)) continue;
    if (Math.abs(v - riverV(u)) < 0.06) continue;
    if (Math.hypot(u - 0.1, v - 0.9) < 0.15 || Math.hypot(u - 0.9, v - 0.1) < 0.15) continue;
    const r = s * (0.006 + rand() * 0.007);
    g.fillStyle = rand() < 0.5 ? 'rgba(20,52,24,.75)' : 'rgba(30,70,30,.65)';
    g.beginPath();
    g.arc(u * s, v * s, r, 0, 7);
    g.fill();
  }

  g.lineCap = 'round';
  g.lineJoin = 'round';
  const path = (pts) => {
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0] * s, p[1] * s) : g.moveTo(p[0] * s, p[1] * s));
  };

  const river = [];
  for (let u = 0; u <= 1.001; u += 0.02) river.push([u, riverV(u)]);
  g.strokeStyle = '#2b6f95';
  g.lineWidth = s * 0.085;
  path(river);
  g.stroke();
  g.strokeStyle = '#3f93bd';
  g.lineWidth = s * 0.06;
  path(river);
  g.stroke();
  g.strokeStyle = 'rgba(160,220,245,.35)';
  g.lineWidth = s * 0.02;
  path(river);
  g.stroke();

  for (const lane of LANES) {
    g.strokeStyle = '#6f5f38';
    g.lineWidth = s * 0.05;
    path(lane);
    g.stroke();
    g.strokeStyle = '#a58f58';
    g.lineWidth = s * 0.036;
    path(lane);
    g.stroke();
  }

  const rad = g.createRadialGradient(s * 0.09, s * 0.91, 0, s * 0.09, s * 0.91, s * 0.19);
  rad.addColorStop(0, '#76b85a');
  rad.addColorStop(0.7, '#5c9a45');
  rad.addColorStop(1, 'rgba(92,154,69,0)');
  g.fillStyle = rad;
  g.fillRect(0, s * 0.6, s * 0.4, s * 0.4);
  const dire = g.createRadialGradient(s * 0.91, s * 0.09, 0, s * 0.91, s * 0.09, s * 0.19);
  dire.addColorStop(0, '#a5714a');
  dire.addColorStop(0.7, '#855a3a');
  dire.addColorStop(1, 'rgba(133,90,58,0)');
  g.fillStyle = dire;
  g.fillRect(s * 0.6, 0, s * 0.4, s * 0.4);

  g.fillStyle = '#e8e2c4';
  g.strokeStyle = '#3d7a2c';
  g.lineWidth = 2;
  g.beginPath(); g.arc(s * 0.075, s * 0.925, s * 0.02, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#f3d9c4';
  g.strokeStyle = '#8a3a2a';
  g.beginPath(); g.arc(s * 0.925, s * 0.075, s * 0.02, 0, 7); g.fill(); g.stroke();

  g.strokeStyle = 'rgba(255,255,255,.12)';
  g.lineWidth = 1;
  g.strokeRect(0.5, 0.5, s - 1, s - 1);
}

function drawMap() {
  view.half = dotaImg ? 10240 : 8000;
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, 10);
  ctx.clip();
  if (!bgCache) {
    const dpr = window.devicePixelRatio || 1;
    bgCache = document.createElement('canvas');
    bgCache.width = Math.round(size * dpr);
    bgCache.height = Math.round(size * dpr);
    const g = bgCache.getContext('2d');
    g.scale(dpr, dpr);
    if (dotaImg) {
      g.fillStyle = '#0e1218';
      g.fillRect(0, 0, size, size);
      g.drawImage(dotaImg, 0, 0, size, size);
    } else {
      paintDota(g, size);
    }
  }
  ctx.drawImage(bgCache, 0, 0, size, size);
  ctx.restore();
}

function teamColor(team) {
  return team === 2 ? '#4ade80' : (team === 3 ? '#f87171' : '#fbbf24');
}

function drawIcon(path, x, y, s) {
  const im = icon(path);
  if (!im) return false;
  ctx.drawImage(im, x - s / 2, y - s / 2, s, s);
  return true;
}

function drawHero(h) {
  const r = h.row;
  const [x, y] = toScreen(h.cx, h.cy);
  ctx.globalAlpha = r.alive === false ? 0.35 : (stale ? 0.5 : 1);
  const im = icon(heroIcon(r.name));
  ctx.fillStyle = teamColor(r.team);
  ctx.beginPath();
  ctx.arc(x, y, im ? 12 : 9, 0, 7);
  ctx.fill();
  if (im) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, 7);
    ctx.clip();
    ctx.drawImage(im, x - 10, y - 10, 20, 20);
    ctx.restore();
  }
  if (r.max_hp > 0 && r.hp >= 0) {
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(x - 11, y + 14, 22, 4);
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(x - 11, y + 14, 22 * Math.max(0, Math.min(1, r.hp / r.max_hp)), 4);
  }
  if (!im) {
    ctx.fillStyle = '#e6edf3';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(pretty(r.name), x, y - 14);
  }
  ctx.globalAlpha = 1;
}

function list(value) {
  return Array.isArray(value) ? value.filter(Boolean) : (value && typeof value === 'object' ? Object.values(value) : []);
}

function drawBoss(path, x, y) {
  if (!drawIcon(path, x, y, 22)) { ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); }
}

function drawLayers() {
  for (const u of list(live.units)) {
    if (typeof u.x !== 'number' || typeof u.y !== 'number') continue;
    const [x, y] = toScreen(u.x, u.y);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = teamColor(u.team);
    if (u.kind === 'building') {
      ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
      if (!drawIcon(TOWER_ICON, x, y, 12)) ctx.fillRect(x - 4, y - 4, 8, 8);
    } else if (u.kind === 'roshan') {
      drawBoss('roshan.png', x, y);
    } else if (u.kind === 'tormentor') {
      drawBoss('dota_minimap_assets/tormentor/tormentor_timer_icon_' + (u.x + u.y < 0 ? 'radiant' : 'dire') + '_png.png', x, y);
    } else if (u.kind === 'wisdom') {
      drawBoss('Wisdom.png', x, y);
    } else {
      ctx.beginPath(); ctx.arc(x, y, u.kind === 'courier' ? 4 : 2.5, 0, 7); ctx.fill();
    }
  }
  for (const w of list(live.wards)) {
    if (typeof w.x !== 'number' || typeof w.y !== 'number') continue;
    const [x, y] = toScreen(w.x, w.y);
    const sentry = w.kind === 'sentry';
    ctx.globalAlpha = 0.95;
    if (!drawIcon(sentry ? 'centry_ward.png' : 'Observer_ward.png', x, y, 16)) {
      ctx.strokeStyle = sentry ? '#60a5fa' : '#facc15';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.stroke();
    }
  }
  for (const r of list(live.runes)) {
    if (typeof r.x !== 'number' || typeof r.y !== 'number') continue;
    const [x, y] = toScreen(r.x, r.y);
    ctx.globalAlpha = 1;
    if (!(RUNE_ICONS[r.rune_type] && drawIcon(RUNE_ICONS[r.rune_type], x, y, 16))) {
      ctx.fillStyle = '#c084fc';
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 5, y); ctx.fill();
    }
  }
  for (const e of list(live.events)) {
    if (typeof e.x !== 'number' || typeof e.y !== 'number') continue;
    const [x, y] = toScreen(e.x, e.y);
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = '#fb923c';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.stroke();
    ctx.fillStyle = '#fed7aa';
    ctx.font = '10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(e.a ? pretty(e.a) : String(e.kind || ''), x, y - 16);
  }
  ctx.globalAlpha = 1;
}

let lastFrame = performance.now();
function frame() {
  const nowMs = performance.now();
  const k = 1 - Math.exp(-Math.min(0.1, (nowMs - lastFrame) / 1000) * 12);
  lastFrame = nowMs;
  drawMap();
  drawLayers();
  for (const id of order) {
    const h = heroes[id];
    if (!h) continue;
    h.cx += (h.row.x - h.cx) * k;
    h.cy += (h.row.y - h.cy) * k;
    drawHero(h);
  }
}

function gameTime() {
  return (live.clock && live.clock.t) || 0;
}

function pct(a, b) {
  return b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;
}

function remaining(readyAt) {
  return typeof readyAt === 'number' ? Math.max(0, readyAt - gameTime()) : 0;
}

function secs(v) {
  return v > 0.5 ? fmt(TEXT.sec, { n: Math.ceil(v) }) : TEXT.ready;
}

function heroExtras(info) {
  if (!info) return '';
  const parts = [];
  const s = info.stats;
  if (s) {
    if (typeof s.k === 'number') parts.push(s.k + '/' + s.d + '/' + s.a);
    if (typeof s.nw === 'number') parts.push((s.partial ? '≥' : '') + Math.round(s.nw / 100) / 10 + 'k');
  }
  if (info.buyback) parts.push(TEXT.buyback + ' ' + secs(remaining(info.buyback.ready_at)));
  if (info.ult) parts.push(TEXT.ult + ' ' + secs(remaining(info.ult.ready_at)));
  let html = parts.length ? '<div class="items">' + esc(parts.join(' · ')) + '</div>' : '';
  const items = list(info.items).map(i => {
    const cd = remaining(i.ready_at);
    return '<b>' + esc(pretty(i.name)) + '</b>' + (cd > 0.5 ? ' ' + esc(fmt(TEXT.sec, { n: Math.ceil(cd) })) : '');
  });
  if (items.length) html += '<div class="items">' + items.join(', ') + '</div>';
  return html;
}

function renderSide() {
  const now = Date.now() / 1000;
  const rows = Object.values(roster).sort((a, b) => a.row.team - b.row.team || String(a.row.id).localeCompare(String(b.row.id)));
  heroesEl.innerHTML = rows.map(entry => {
    const r = entry.row;
    const inView = !!heroes[String(r.id)];
    const note = r.alive === false ? TEXT.dead + (r.respawn_at ? ', ' + secs(remaining(r.respawn_at)) : '')
      : (inView ? TEXT.visible : fmt(TEXT.fog, { n: Math.round(now - entry.seen) }));
    return '<div class="row team-' + esc(r.team) + (inView ? '' : ' fog') + '">' +
      '<div class="top"><img src="radar/icons/' + esc(heroIcon(r.name)) + '" alt="" onerror="this.style.visibility=\'hidden\'"><span class="name">' + esc(pretty(r.name)) + '</span><span class="meta">' + esc(TEXT.lvl) + ' ' + esc(r.level || '?') + '</span></div>' +
      '<div class="meta">' + esc(note) + '</div>' +
      '<div class="bar hp"><i style="width:' + pct(r.hp, r.max_hp) + '%"></i></div>' +
      '<div class="bar mp"><i style="width:' + pct(r.mana, r.max_mana) + '%"></i></div>' +
      heroExtras(entry.info) + '</div>';
  }).join('');
}

function clockText(t) {
  t = Math.trunc(t || 0);
  const sign = t < 0 ? '-' : '';
  t = Math.abs(t);
  return sign + Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

function cdText(v) {
  return typeof v === 'number' ? secs(remaining(v)) : '—';
}

function bossText(o) {
  if (o.alive === false) return TEXT.bossDead;
  const hp = typeof o.hp === 'number' ? 'HP ' + o.hp + '%' : TEXT.bossSeen;
  return hp + (o.under_attack ? ' · ' + TEXT.bossHit : '');
}

function renderObjs() {
  const obj = live.objectives || {};
  const rows = [[TEXT.roshan, obj.roshan ? bossText(obj.roshan) : TEXT.noData]];
  const torms = list(obj.tormentors);
  torms.forEach(function (t, i) {
    rows.push([TEXT.tormentor + (torms.length > 1 ? ' ' + (i + 1) : ''), bossText(t)]);
  });
  rows.push([TEXT.glyph, cdText(obj.glyph_radiant) + ' / ' + cdText(obj.glyph_dire)]);
  rows.push([TEXT.scan, cdText(obj.scan_radiant) + ' / ' + cdText(obj.scan_dire)]);
  objsEl.innerHTML = rows.map(r => '<div class="o"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>').join('');
}

function placeText(code) {
  if (!code) return null;
  return String(code).split(',').map(function (one) {
    if (TEXT.place[one]) return TEXT.place[one];
    const parts = one.split('_');
    return TEXT.zone[parts[0]] && TEXT.side[parts[1]] ? TEXT.zone[parts[0]] + ', ' + TEXT.side[parts[1]] : one;
  }).join(', ');
}

function bossName(e) {
  if (e.b === 'rosh') return TEXT.boss.rosh;
  return e.team ? fmt(TEXT.boss.tormSide, { side: TEXT.boss[e.team] }) : TEXT.boss.torm;
}

function feedText(e) {
  const f = TEXT.feed;
  const values = {
    h: e.h ? pretty(e.h) : null, p: placeText(e.p), r: typeof e.r === 'number' ? Math.round(e.r) : null,
    a: typeof e.a === 'number' ? TEXT.runes[e.a] : (e.a ? pretty(e.a) : null),
    team: e.team ? TEXT.boss[e.team] : null, b: e.b ? bossName(e) : null,
    v: typeof e.v === 'number' ? e.v + '%' : '?', n: e.n ? ' (' + list(e.n).map(pretty).join(', ') + ')' : '',
  };
  let key = e.k;
  if (key === 'death' && values.r) key = 'deathRespawn';
  if (key === 'rune' && values.p) key = 'runeAt';
  if (key === 'scan_used' && values.p) key = 'scan_usedAt';
  return f[key] ? fmt(f[key], values) : String(e.k || '');
}

function feedClass(e) {
  const k = String(e.k || '');
  if (k.indexOf('boss') === 0) return 'boss';
  if (k === 'rune') return 'rune ' + (e.s || '');
  if (k === 'scan' || k === 'scan_used' || k === 'glyph') return 'scan';
  return e.s || '';
}

const feedLines = new Map();
function feedLine(key, e) {
  let line = feedLines.get(key);
  if (!line) {
    line = document.createElement('div');
    feedLines.set(key, line);
    let next = null;
    for (const [other, el] of feedLines) if (other > key && (!next || other < next.key)) next = { key: other, el };
    logEl.insertBefore(line, next ? next.el : null);
  }
  line.className = feedClass(e);
  line.textContent = '';
  const t = document.createElement('span');
  t.className = 't';
  t.textContent = clockText(e.t);
  line.appendChild(t);
  line.appendChild(document.createTextNode(feedText(e)));
}

function applyLive() {
  const clock = live.clock || {};
  clockEl.textContent = clock.in_game ? clockText(clock.t) : '';
  if (!clock.in_game) { roster = {}; heroes = {}; order = []; }
  const info = live.info || {};
  const next = {};
  const ids = [];
  const now = Date.now() / 1000;
  for (const row of list(live.pos)) {
    if (typeof row.x !== 'number' || typeof row.y !== 'number') continue;
    const key = String(row.id);
    const old = heroes[key];
    next[key] = { row: row, cx: old ? old.cx : row.x, cy: old ? old.cy : row.y };
    const prev = roster[key];
    roster[key] = { row: row, seen: now, info: info['h' + key] || (prev && prev.info) };
    ids.push(key);
  }
  heroes = next;
  order = ids;
  renderObjs();
  renderSide();
}

function refreshStatus() {
  let text;
  if (!sessionId) text = TEXT.badLink;
  else if (!connected) text = TEXT.offline;
  else if (!meta) text = metaSeen ? TEXT.closed : TEXT.missing;
  else {
    const age = (Date.now() + serverOffset - (meta.updated || 0)) / 1000;
    stale = age > 3;
    text = stale ? TEXT.stale : ((live.clock && live.clock.in_game) ? TEXT.online : TEXT.waiting);
  }
  if (!meta) stale = true;
  statusEl.textContent = text;
}

if (/^[A-Za-z0-9]{20}$/.test(sessionId)) {
  const db = getDatabase(initializeApp(firebaseConfig));
  const base = 'sessions/' + sessionId;
  onValue(ref(db, '.info/connected'), snap => { connected = snap.val() === true; refreshStatus(); });
  onValue(ref(db, '.info/serverTimeOffset'), snap => { serverOffset = snap.val() || 0; });
  onValue(ref(db, base + '/meta'), snap => {
    meta = snap.val();
    if (meta) metaSeen = true;
    if (!meta) { live = {}; applyLive(); }
    refreshStatus();
  }, () => { meta = null; refreshStatus(); });
  onValue(ref(db, base + '/live'), snap => { live = snap.val() || {}; applyLive(); refreshStatus(); }, () => {});
  const feed = query(ref(db, base + '/feed'), limitToLast(100));
  const atBottom = () => logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 8;
  onChildAdded(feed, snap => { const stick = atBottom(); feedLine(snap.key, snap.val() || {}); if (stick) logEl.scrollTop = logEl.scrollHeight; });
  onChildChanged(feed, snap => feedLine(snap.key, snap.val() || {}));
  onChildRemoved(feed, snap => { const line = feedLines.get(snap.key); if (line) line.remove(); feedLines.delete(snap.key); });
} else {
  connected = true;
}
refreshStatus();
setInterval(function () { refreshStatus(); renderSide(); renderObjs(); }, 1000);

try {
  const wurl = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},33)'], { type: 'text/javascript' }));
  new Worker(wurl).onmessage = frame;
} catch (e) {
  setInterval(frame, 33);
}
window.addEventListener('hashchange', () => location.reload());

const popBtn = document.getElementById('popcon');
if (!window.documentPictureInPicture) popBtn.style.display = 'none';
popBtn.onclick = async function () {
  try {
    if (consoleEl.ownerDocument !== document) {
      window.documentPictureInPicture.window.close();
      return;
    }
    const w = await window.documentPictureInPicture.requestWindow({ width: 380, height: 340 });
    for (const st of document.querySelectorAll('style')) w.document.head.appendChild(st.cloneNode(true));
    consoleEl.classList.add('pop');
    w.document.body.appendChild(consoleEl);
    w.addEventListener('pagehide', function () {
      consoleEl.classList.remove('pop');
      side.insertBefore(consoleEl, side.firstChild);
    });
  } catch (e) {
    statusEl.textContent = TEXT.noWindow + e.message;
  }
};

const pipBtn = document.getElementById('pip');
let pipVideo = null;
if (!document.pictureInPictureEnabled || !canvas.captureStream) pipBtn.style.display = 'none';
pipBtn.onclick = async function () {
  try {
    if (document.pictureInPictureElement) {
      await document.exitPictureInPicture();
      return;
    }
    if (!pipVideo) {
      pipVideo = document.createElement('video');
      pipVideo.muted = true;
      pipVideo.playsInline = true;
      pipVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.appendChild(pipVideo);
      pipVideo.srcObject = canvas.captureStream(30);
    }
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
  } catch (e) {
    statusEl.textContent = TEXT.noWindow + e.message;
  }
};
</script>
</body>
</html>
